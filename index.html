// 帳票一覧の分類の並び：使う頻度の高い順（ユーザー指示、設備点検が一番上）。ここに無い分類は後ろに帳票No.の順で並ぶ
const CAT_ORDER = ['設備点検', '作業環境・5S', '検査機器', '品質会議', '教育訓練', '内部監査・是正', '台帳', '生産準備'];
function sortCats(list) {
  const rank = c => { const i = CAT_ORDER.indexOf(c); return i < 0 ? CAT_ORDER.length : i; };
  return list.map((c, i) => [c, i]).sort((a, b) => rank(a[0]) - rank(b[0]) || a[1] - b[1]).map(x => x[0]);
}
function renderChips() {
  const cats = ['すべて'].concat(sortCats([...new Set(S.boot.forms.map(f => f.cat))]));
  $('#chips').innerHTML = cats.map(c => '<button class="chip" aria-pressed="' + (c === S.cat) + '" data-c="' + esc(c) + '">' + esc(c) + '</button>').join('');
  $('#chips').querySelectorAll('.chip').forEach(b => b.addEventListener('click', () => { S.cat = b.dataset.c; renderChips(); renderFormList(); }));
}
function renderFormList() {
  const q = S.q.trim().toLowerCase();
  const hit = S.boot.forms.filter(f => (S.cat === 'すべて' || f.cat === S.cat) && (!q || (f.name + f.code + f.cat).toLowerCase().indexOf(q) >= 0));
  if (!hit.length) { $('#formList').innerHTML = '<p class="empty">「' + esc(q) + '」に当てはまる帳票はありません。言葉を短くして探してみてください。</p>'; return; }
  const groups = sortCats([...new Set(hit.map(f => f.cat))]);
  $('#formList').innerHTML = groups.map(g => {
    const rows = hit.filter(f => f.cat === g);
    return '<div class="group"><div class="group-title"><h2>' + esc(g) + '</h2><span>' + rows.length + '種類</span></div>' + '<div class="form-row form-head" aria-hidden="true"><span class="no">No.</span><span>帳票名・管理番号</span><span class="kind">記入のしかた</span><span class="freq">頻度</span><span class="act">使い方</span></div>' + rows.map(f => {
      const off = f.status && f.status !== '運用中';
      const kind = off ? '<span class="tag off">' + esc(f.status) + '</span>' : f.web ? '<span class="tag web">Web入力（試験運用）</span>' : f.ext ? '<span class="tag ext">' + esc(f.app.replace('別アプリ：', '')) + '</span>' : '<span class="tag paper">紙で運用中</span>';
      const act = off ? '' : f.web ? (f.no === 10 ? '<button class="btn" data-ledger="1">台帳を見る</button> ' : '') + '<button class="btn primary" data-form="' + f.no + '">記入する</button>'
        : f.ext && f.extUrl ? '<a class="linkbtn" href="' + esc(f.extUrl) + '" target="_blank" rel="noopener">アプリを開く ↗</a>'
        : '<span class="code">' + (f.ext ? '別アプリで記入' : '紙の様式を使用') + '</span>';
      return '<div class="form-row"><span class="no">' + String(f.no).padStart(2, '0') + '</span><div class="nm"><div class="name">' + esc(f.name) + '</div><div class="code mono">' + esc(f.code) + '</div></div><span class="kind">' + kind + '</span><span class="freq">' + esc(f.freq) + '</span><span class="act">' + act + '</span></div>';
    }).join('') + '</div>';
  }).join('');
  $('#formList').querySelectorAll('[data-form]').forEach(b => b.addEventListener('click', () => openEntry(+b.dataset.form)));
  $('#formList').querySelectorAll('[data-ledger]').forEach(b => b.addEventListener('click', () => openLedger()));

/* ================= 設備台帳を見る ================= */
// 設備台帳（v0.13.0）：上に数字の帯と絞り込み、左に一覧、右に選んだ1台の詳細（基本情報・点検の設定・廃棄の届け・変更の記録）
const LED_TABS = [['info', '基本情報'], ['chk', '点検の設定'], ['dis', '廃棄の届け'], ['hist', '変更の記録']];
const ledActive = x => !/^廃棄/.test(String(x.inUse || ''));
const ledFormShort = n => String(n || '').replace('始業前設備点検記録', '始業前点検').replace('設備点検記録', '設備点検');
async function openLedger(keep) {
  let d;
  try { d = await run('getMachineList', S.asEmail); } catch (e) { return; }
  S.ledger = d;
  if (!keep) { S.ledgerQ = ''; S.ledF = 'all'; S.ledSel = ''; S.ledTab = 'info'; }
  S.ledEdit = false;
  $('#v-ledger').innerHTML = '<div class="led-head"><div><div class="eyebrow">設備管理 ・ ' + esc(d.form.code) + '</div><h1>' + esc(d.form.name) + '</h1></div>' +
    '<button class="btn primary" id="ledAdd">＋ 新しい設備を登録する</button></div>' +
    '<div class="led-stats" id="ledStats"></div>' +
    '<div class="led-filters"><input type="search" id="ledQ" placeholder="機番・規格・名称・メーカー・点検する人で探す" aria-label="設備を探す" value="' + esc(S.ledgerQ) + '"><div class="led-chips" id="ledChips" role="group" aria-label="絞り込み"></div></div>' +
    '<div class="led-layout"><div class="led-list"><table class="led-tbl"><thead><tr><th>機番</th><th>規格・名称</th><th class="led-hs">メーカー</th><th>点検</th><th class="led-hs">点検する人</th><th class="led-hs">設備なしの項目</th></tr></thead><tbody id="ledBody"></tbody></table></div>' +
    '<aside class="led-detail" id="ledDetail" aria-live="polite"></aside></div>' +
    '<p class="hint" style="margin-top:10px">台帳を直せるのは ' + esc(d.editors || '―') + ' さんです。追加と廃棄は社長の承認が要ります。</p>';
  $('#ledQ').addEventListener('input', e => { S.ledgerQ = e.target.value; renderLedger(); });
  $('#ledAdd').addEventListener('click', () => openEntry(10));
  renderLedger();
  renderLedgerDetail();
  go('ledger');
}
function ledFilters() {
  const ms = S.ledger.machines, act = ms.filter(ledActive);
  const forms = [];
  act.forEach(x => { if (x.webForm && !forms.some(f => f[0] === String(x.webForm))) forms.push([String(x.webForm), ledFormShort(x.checkForm)]); });
  forms.sort((a, b) => a[0] - b[0]);
  return [['all', 'すべて']].concat(forms.map(f => ['f' + f[0], f[1]]), [['other', '点検なし'], ['none', '設備なしの項目あり'], ['dis', '廃棄済み']]);
}
function renderLedger() {
  const d = S.ledger, ms = d.machines, act = ms.filter(ledActive);
  const nPend = Object.keys(d.pending || {}).length;
  const forms = ledFilters().filter(f => /^f/.test(f[0]));
  $('#ledStats').innerHTML = [['使用中', act.length + '台', '']].concat(forms.map(f => [f[1], act.filter(x => 'f' + x.webForm === f[0]).length + '台', '']),

/* ---- ② まとめて記入（担当の機械を1画面で。縦に点検項目・横に機械） ---- */
const MT_MARKS = [['レ', '問題なし', ''], ['△', '調整した', 'w'], ['×', '要修理', 'x'], ['━', '設備なし', ''], ['／', '稼働なし', '']];

// 担当が2台以上ならまとめて記入、1台以下なら今までの1台ずつの画面
async function openMulti(formNo, date) {
  let d;

  if (d.machines.length < 2) { openDaily(formNo, d.machines.length ? d.machines[0].no : '', (date || d.today).slice(0, 7), date); return; }

    d.items.forEach(it => { const x = mtItem(it, mc); if (x.fixed) S.msel[mc.no].marks[it.no] = x.fixed; }); // 設備なしは ━ で固定

// その機械での項目（エアー圧の単位は機種によって kgf/cm²）

function mtItem(it, mc) { const o = (mc.items || []).find(x => x.no === it.no); return o ? Object.assign({}, it, { unit: o.unit, min: o.min, max: o.max, fixed: o.fixed }) : it; }
function mtEditable(mc) { return !!S.msel[mc.no]; }
// 入力がまだの項目の数と、提出できない理由
function mtCheck(mc) {
  const s = S.msel[mc.no]; if (!s) return { left: 0, why: '' };
  let left = 0, why = '';
  const names = [], short = it => it.name.replace(/（.*$/, '');
  S.multi.items.forEach(it0 => {
    const it = mtItem(it0, mc), mk = s.marks[it.no];
    if (isDoItem(it) || (isWeekly(it) && !mk && blankNum(s.nums[it.no]))) return;
    if (!mk) { left++; names.push(short(it)); return; }
    if (isNumItem(it) && mk !== '／' && mk !== '━') {
      const j = judgeNum(it, s.nums[it.no]);
      if (!j) { left++; names.push(short(it) + 'の数値'); }
      else if (j === 'out' && mk === mtOk()) { left++; names.push(short(it) + '（範囲外なのにレ）'); why = why || '範囲外の数値にレがついています'; }
    }
  });
  const bad = Object.values(s.marks).some(v => v === '△' || v === '×');
  if (!left && bad && !String(s.note).trim()) why = '△・×があるので、備考に内容を書いてください';
  return { left: left, why: why, names: names };
}
function mtReady(mc) { const c = mtCheck(mc); return mtEditable(mc) && !c.left && !c.why; }
function mtChip(mc) {
  if (mc.locked) return '<span class="mt-chip done">承認済み</span>';

}

/* ---- 1枚で何台か点検する帳票（No.15 研磨機・No.16 フライス盤）：使った機械ごとに記号を付ける（v0.15.0） ---- */
const GMARKS = [['レ', '問題なし', 'ok'], ['△', '調整した', 'tri'], ['×', '要修理', 'x'], ['━', '設備なし', 'na']];

function validateNum(no, typed) {
  const it = S.daily.items.find(x => String(x.no) === String(no)); if (!it) return;
  const j = judgeNum(it, S.sel.nums[no]);
  const box = $('#nb' + no); if (box) { box.classList.toggle('bad', j === 'out'); box.classList.toggle('good', j === 'in'); }
  const msg = $('#msg' + no);
  if (msg) {
    msg.className = 'num-msg' + (j === 'in' ? ' ok' : '');
    msg.textContent = j === 'in' ? '範囲内' : j === 'out' ? '範囲外（' + rangeOf(it).text + '）' : '';
  }
  const ok = document.querySelector('.ctrl[data-no="' + no + '"] .mark[data-m="レ"]');
  if (ok && S.daily.state !== '承認済み') {
    ok.disabled = j === 'out';
    if (j === 'out' && S.sel.marks[no] === okM()) {
      delete S.sel.marks[no];
      ok.setAttribute('aria-pressed', 'false');
      refreshAlerts();
    }
    // 範囲が決まっている数値（ガイドブッシュエアーシール・高圧クーラント圧力など）は、範囲内なら自動で「レ（問題なし）」にする。
    // 自分で△などを選んでいるときはそのまま。自動で選んだ「レ」は、数値を範囲外にしたり消したりしたら外す
    if (typed) {
      S.sel.autoOk = S.sel.autoOk || {};
      const ctrl = document.querySelector('.ctrl[data-no="' + no + '"]');
      const press = m => ctrl.querySelectorAll('.mark').forEach(x => x.setAttribute('aria-pressed', x.dataset.m === m));
      if (j === 'in' && (!S.sel.marks[no] || S.sel.autoOk[no])) {
        S.sel.marks[no] = okM(); S.sel.autoOk[no] = true; press(okM()); refreshAlerts();
      } else if (j !== 'in' && S.sel.autoOk[no]) {
        if (S.sel.marks[no] === okM()) { delete S.sel.marks[no]; press(''); refreshAlerts(); }
        delete S.sel.autoOk[no];
      }
    }
  }
}
// 書き始めた日だけ、まだの項目に「未入力」（v0.21.2）
function dayMiss() {
  const items = checkItems(), sel = S.sel;
  const on = items.some(it => !it.fixed && sel.marks[it.no]) || Object.keys(sel.nums || {}).some(k => String(sel.nums[k]).trim());
  items.forEach(it => {
    const c = document.querySelector('.ctrl[data-no="' + it.no + '"]'); if (!c) return;
    const box = c.closest('.item');
    let miss = '';
    if (on && !it.fixed && !isDoItem(it) && !(isWeekly(it) && !sel.marks[it.no] && blankNum(sel.nums[it.no]))) {
      const mk = sel.marks[it.no];
      if (!mk) miss = '未入力';
      else if (isNumItem(it) && mk !== '／' && mk !== '━' && !judgeNum(it, sel.nums[it.no])) miss = '数値が未入力';
    }
    box.classList.toggle('miss', !!miss); if (miss) box.dataset.miss = miss; else delete box.dataset.miss;
  });
}
function refreshAlerts() {
  dayMiss();
  const v = Object.values(S.sel.marks);
  const xa = $('#xAlert'); if (xa) xa.hidden = v.indexOf('×') < 0;
  const n = $('#note'); if (n) n.classList.toggle('need', v.indexOf('×') >= 0 || v.indexOf('△') >= 0);

async function submitDay(msg) {
  if (S.sel.date === 'monthly') return submitMonthly();
  const d = S.daily, sel = S.sel;
  const items = checkItems();
  const missing = items.filter(it => !isDoItem(it) && !sel.marks[it.no] && !(isWeekly(it) && blankNum(sel.nums[it.no])));
  if (missing.length) { toast('まだ選んでいない項目があります（' + missing.map(it => it.no - 2).join('・') + '番）', true); return; }
  for (const it of items.filter(isNumItem)) {
    const mk = sel.marks[it.no];
    if (mk === '／' || mk === '━') continue;
    if (isWeekly(it) && !mk && blankNum(sel.nums[it.no])) continue; // 週に1回の項目は、測らない日は空欄でよい
    const j = judgeNum(it, sel.nums[it.no]);
    if (!j) { toast('「' + it.name.replace(/（.*$/, '') + '」の数値を入れてください', true); const el = $('#num' + it.no); if (el) el.focus(); return; }
    if (j === 'out' && mk === okM()) { toast('「' + it.name.replace(/（.*$/, '') + '」は範囲外なので、△か×を選んでください', true); return; }
  }
  const v = items.map(it => sel.marks[it.no]);
  if ((v.indexOf('×') >= 0 || v.indexOf('△') >= 0) && !String(sel.note).trim()) { toast('△・×があるので、備考に内容を書いてください', true); $('#note').focus(); return; }
  const marks = {};
  // 「実施」の項目で押さなかったもの（実施しなかった日）は ／ を入れる
  items.forEach(it => { marks[it.no] = { mark: sel.marks[it.no] || (isDoItem(it) || isWeekly(it) ? '／' : sel.marks[it.no]), num: sel.nums[it.no] !== undefined ? String(sel.nums[it.no]) : '' }; });
  let r;
  try { r = await run('saveDaily', { formNo: d.form.no, machineNo: d.machine.no, date: sel.date, marks: marks, note: sel.note }, S.asEmail); } catch (e) { return; }
  toast(msg + (r.reconfirm ? '（確認済みの日を直したので、確認をやり直してもらいます）' : ''));
  await openDaily(d.form.no, d.machine.no, d.ym, sel.date, r.sheet);
  boot(true);
  if (v.indexOf('×') >= 0) offerIjou([{ date: sel.date, machine: d.machine.label, what: sel.note, src: d.form.no + ':' + d.machine.no + ':' + sel.date }]);
}

function genRenderPick(no) {

  }).join('') || '<p class="hint">当てはまる人がいません</p>';
  const set = list => { g.pick[no] = list; genRenderPick(no); genUpdate(); };
  w.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => set(sel.filter(x => x !== b.dataset.rm)));
  w.querySelectorAll('.gen-nm').forEach(b => b.onclick = () => { const n = b.dataset.n; set(sel.indexOf(n) >= 0 ? sel.filter(x => x !== n) : sel.concat(n)); });

function genFilled(it) {

  if (it.kind === '選択' || it.kind === '選択＋ファイル') {
    const r = document.querySelector('input[name="' + id + '"]:checked'); if (!r) return false;

      return keep.length + (S.generic.files[it.no] || []).length > 0;
    }

  }
  if (it.kind === '社員から選ぶ（複数）') return (S.generic.pick[it.no] || []).length > 0;
  const el = $('#' + id); return !!(el && el.value.trim());

function genUpdate() {
  const g = S.generic, secs = genSections();
  let left = 0;
  const lis = [];
  secs.forEach(([t, items], i) => {
    const req = items.filter(it => it.required === 'はい'), done = req.filter(genFilled).length;
    const started = items.some(genFilled);
    items.forEach(it => { const el = document.querySelector('.gen-f[data-item="' + it.no + '"]'); if (el) { const miss = started && it.required === 'はい' && !genFilled(it); el.classList.toggle('miss', miss); if (miss) el.dataset.miss = '未入力'; else delete el.dataset.miss; } });
    const c = $('#gsc' + i); if (c) { c.textContent = done === req.length ? '✔ 入力済み' : '残り ' + (req.length - done) + '項目'; c.className = done === req.length ? 'done' : ''; }
    req.forEach(it => {
      const ok = genFilled(it); if (!ok) left++;
      let name = it.name.replace(/（.*$/, '');
      if (it.kind === '社員から選ぶ（複数）') name += '（' + (g.pick[it.no] || []).length + '人）';
      if (it.kind === '選択＋ファイル') { let keep = []; try { keep = JSON.parse($('#keep' + it.no).value || '[]'); } catch (e) {} const n = keep.length + (g.files[it.no] || []).length; if (n) name += '（' + n + '件）'; }
      lis.push('<li class="' + (ok ? 'ok' : 'no') + '"><i>' + (ok ? '✔' : '！') + '</i><a href="#gs' + i + '" data-go="' + it.no + '">' + esc(name) + '</a></li>');
    });
  });
  $('#genChk').innerHTML = lis.join('');
  $('#genChk').querySelectorAll('[data-go]').forEach(a => a.addEventListener('click', e => { e.preventDefault(); const el = document.querySelector('[data-item="' + a.dataset.go + '"]'); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' }); }));

  const ps = pItem ? (g.pick[pItem.no] || []) : [];
  const route = g.def.route, steps = [];
  if (pItem) steps.push('<li><b>' + esc(pItem.name.replace(/（.*$/, '')) + 'の押印</b><small>' + (ps.length ? esc(ps.join('、')) + '（' + ps.length + '人）が、それぞれ三文判を押す' : '選ぶと、ここに名前が出ます') + '</small></li>');
  if (route.needsCheck) steps.push('<li><b>確認</b><small>' + esc(route.checker || '―') + ' さん</small></li>');
  steps.push('<li><b>承認</b><small>' + esc(route.approver || '―') + ' さん</small></li>');
  steps.push('<li><b>PDFができる</b><small>承認されると、紙と同じ形のPDFが保存される</small></li>');
  $('#genFlow').innerHTML = steps.join('');
  $('#genMsg').textContent = left ? 'まだの項目が ' + left + 'つあります' : '';
  $('#genSubmit').disabled = left > 0;
  document.querySelectorAll('[data-count]').forEach(c => { const t = $('#' + c.dataset.count); c.textContent = t ? t.value.length + '文字' : ''; });
}
function readFileB64(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(String(r.result).split(',')[1]);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}
async function submitGeneric() {
  const g = S.generic, values = {}, files = [];
  const items = g.def.items.filter(it => !/^(承認|自動)$/.test(it.kind));
  for (const it of items) {
    const id = 'f' + it.no;
    if (it.kind === '選択' || it.kind === '選択＋ファイル') {
      const r = document.querySelector('input[name="' + id + '"]:checked');
      let choice = r ? r.value : '';
      if (choice === 'その他') { const o = $('#other' + it.no); choice = 'その他：' + (o ? o.value.trim() : ''); }
      if (it.kind === '選択＋ファイル') {
        let keep = [];
        try { keep = JSON.parse($('#keep' + it.no).value || '[]'); } catch (e) {}
        values[it.no] = choice ? JSON.stringify({ choice: choice, files: keep }) : '';
        for (const file of (g.files && g.files[it.no]) || []) {
          if (file.size > 10 * 1024 * 1024) { toast(file.name + ' は10MBを超えているので添付できません', true); return; }
          files.push({ itemNo: it.no, name: file.name, mimeType: file.type || 'application/octet-stream', data: await readFileB64(file) });
        }
      } else values[it.no] = choice;
    } else if (it.kind === '社員から選ぶ（複数）') {
      values[it.no] = ((g.pick && g.pick[it.no]) || []).join('、');
    } else {
      const el = $('#' + id); values[it.no] = el ? el.value.trim() : '';
    }
    if (it.required === 'はい' && !values[it.no]) { toast('「' + it.name + '」を入力してください', true); return; }
  }
  let r;
  try { r = await run('saveRecord', { formNo: g.def.form.no, recordId: g.recordId, values: values, files: files }, S.asEmail); } catch (e) { return; }
  toast('提出しました（' + r.state + '）');
  await boot(true);
  openDetail(r.recordId, 'records');
}

/* ================= 記録の中身 ================= */
// 月のまとめ：記入日数・稼働なし・△×範囲外の日と備考・管理監督者の確認
function monthSummaryHtml() {
  const d = S.daily, dates = Object.keys(d.days).sort(), items = checkItems();
  const rest = dates.filter(x => d.days[x].rest);
  const noRun = dates.filter(x => !d.days[x].rest && items.filter(it => !isDoItem(it)).every(it => (d.days[x].marks[it.no] || {}).mark === '／'));
  const issues = dates.map(x => {
    const day = d.days[x];
    const what = items.map(it => {
      const mk = day.marks[it.no] || { mark: '', num: '' };
      const out = mk.num !== '' && judgeNum(it, mk.num) === 'out';
      return (mk.mark === '△' || mk.mark === '×' || out) ? it.name.replace(/（.*$/, '') + '：' + mk.mark + (mk.num !== '' ? ' ' + mk.num + it.unit + (out ? '（範囲外）' : '') : '') : '';
    }).filter(String);
    return what.length ? { date: x, what: what, note: day.note } : null;
  }).filter(Boolean);
  const unconf = dates.filter(x => !d.confirmed[x] && !d.days[x].rest);
  const until = d.today && d.today.slice(0, 7) === d.ym ? d.today : '9999-12-31';
  const work = daysOf(d.ym).filter(x => x <= until && isWorkday(x));
  const blank = work.filter(x => !d.days[x]);
  const offEntered = dates.filter(x => !isWorkday(x));
  return '<div class="msum"><h3>この月のまとめ（' + esc(d.ym) + '）</h3><dl>' +
    '<dt>出勤日（会社カレンダー）</dt><dd>' + work.length + '日' + (until !== '9999-12-31' ? '（今日まで）' : '') + '</dd>' +
    '<dt>記入した日</dt><dd>' + dates.length + '日（うち稼働なし ' + noRun.length + '日' + (rest.length ? '、休み ' + rest.length + '日' : '') + (offEntered.length ? '、休みの日の記入 ' + offEntered.length + '日' : '') + '）</dd>' +
    '<dt>記入がない日</dt><dd>' + (blank.length ? '<b class="ng">' + blank.length + '日分</b>（出勤日なのに記入がない日）<br><small>' + blank.map(x => esc(x.slice(5, 7) + '月' + x.slice(8) + '日')).join('、') + '</small>' : 'なし（出勤日はすべて記入あり）') + '</dd>' +
    '<dt>管理監督者の確認</dt><dd>' + (unconf.length ? '<b class="ng">未確認 ' + unconf.length + '日</b>' : '全日確認済み') + '</dd>' +
    '<dt>△・×・範囲外</dt><dd>' + (issues.length ? '<ul>' + issues.map(x => '<li><button class="linkbtn" data-jump="' + x.date + '">' + x.date.slice(5, 7) + '月' + x.date.slice(8) + '日</button>　' + esc(x.what.join('、')) + (x.note ? '<br><small>備考：' + esc(x.note) + '</small>' : '') + '</li>').join('') + '</ul>' : 'なし') + '</dd></dl></div>';
}
// 1日分の記入内容（正式な項目名・記号・数値・範囲の判定・備考・記入者）
function dayDetailHtml(date) {
  const d = S.daily, day = d.days[date];
  if (!day) return '<div class="dayd"><h3>' + jpDate(date) + '</h3><p class="empty">この日の記入はありません。</p></div>';
  const conf = d.confirmed[date];
  const rows = (isGroupDaily() ? d.items.filter(it => grpKind(it)) : checkItems()).map(it => {
    const mk = day.marks[it.no] || { mark: '', num: '' };
    if (grpKind(it)) {
      const k = grpKind(it), o = parseMk(mk.text);
      const txt = k === 'used' ? (mk.mark === '／' ? '稼働なし' : parseNos(mk.text).map(n => n + ' ' + gName(n)).join('、')) : /^per/.test(k) ? (mk.mark === '／' ? '／' : Object.keys(o).map(n => n + '：' + o[n]).join('　')) : (mk.mark === '／' ? '／' : parseNos(mk.text).join('・') || '―');
      return '<tr><th>' + esc(it.name) + '</th><td class="mk ' + (mk.mark === '×' ? 'x' : mk.mark === '△' ? 'tri' : '') + '" colspan="3">' + esc(txt) + '</td></tr>';
    }
    const r = rangeOf(it);
    const mcls = mk.mark === '×' ? 'x' : mk.mark === '△' ? 'tri' : '';
    return '<tr><th>' + (it.no - 2) + '. ' + esc(it.name) + '</th><td class="mk ' + mcls + '">' + esc(mk.mark) + '</td>' +
      '<td class="mono">' + (mk.num !== '' ? esc(mk.num) + ' ' + esc(it.unit) : '') + '</td>' +
      '<td>' + judgeBadge(judgeNum(it, mk.num)) + (r.has && mk.num !== '' ? ' <small>' + esc(r.text) + '</small>' : '') + '</td></tr>';
  }).join('');
  return '<div class="dayd"><h3>' + jpDate(date) + 'の記入内容</h3>' +
    '<div class="meta">記入：' + esc(day.by) + '（' + esc(fmtAt(day.at)) + '）　管理監督者の確認：' + (conf ? esc(conf.by) + '（' + esc(fmtAt(conf.at)) + '）' : '<b>まだ</b>') + '</div>' +
    '<div class="tbl-wrap"><table class="dayt"><thead><tr><th>点検項目</th><th>結果</th><th>数値</th><th>判定（範囲）</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
    '<div class="dnote"><b>備考</b>　' + (day.note ? esc(day.note) : 'なし') + '</div></div>';
}

function bkcRender(d, rows) {

  const days = Array.from({ length: last }, (_, i) => i + 1);
  const ds = n => ym + '-' + String(n).padStart(2, '0');
  const off = d.offDays || [];
  const wdC = n => { const w = new Date(ds(n) + 'T00:00:00').getDay(); return (off.indexOf(ds(n)) >= 0 ? 'we ' : '') + (w === 6 ? 'sat' : w === 0 ? 'sun' : ''); };
  const SYM = { k: S.bkOk || 'レ', t: '△', x: '×', n: '／', m: '', o: '・', r: '休', ' ': '' };
  const TIP = { k: '問題なし', t: '△・範囲外・備考あり', x: '×（要修理）', n: '稼働なし', m: '記入なし', o: '休み', r: '担当者が休み', ' ': '' };

  rows.forEach(x => {
    const st = x.st === 'wait' ? '<span class="bkc-tag wait">確認待ち</span>' : x.st === 'bad' ? '<span class="bkc-tag bad">要確認</span>' : '<span class="bkc-tag ok">問題なし</span>';
    const cb = x.st === 'ok' ? '<input type="checkbox" data-pk="' + esc(x.recordId) + '"' + (S.bkPick[x.recordId] ? ' checked' : '') + ' aria-label="' + esc(x.label) + 'をまとめて承認に入れる">' : '<span class="bkc-cbsp"></span>';
    const open = S.bkOpen === x.recordId;
    h += '<tr class="bkc-row' + (open ? ' open' : '') + '" data-row="' + esc(x.recordId) + '" tabindex="0"><td class="bkc-mc"><label>' + cb + '<span><b>' + esc(x.label) + '</b><small>' + esc(x.inspector || '') + (periods_(rows) ? '　' + esc(x.period) : '') + '</small></span></label></td><td class="bkc-st">' + st + '</td>' +
      days.map(n => { const c = x.cal.charAt(n - 1) || ' ', u = (x.unc || []).indexOf(ds(n)) >= 0; return '<td class="d"><span class="' + (c === ' ' ? 'f' : c) + (u ? ' u' : '') + '" title="' + (+ym.slice(5, 7)) + '月' + n + '日 ' + TIP[c] + (u ? '（確認まだ）' : '') + '">' + SYM[c] + '</span></td>'; }).join('') + '</tr>';
    if (open) h += '<tr class="bkc-det"><td colspan="' + (last + 2) + '"><div id="bkDet"><p class="hint">読み込み中…</p></div></td></tr>';
  });
  $('#bkCal').innerHTML = h + '</tbody>';
  const upd = () => {
    const n = d.ok.filter(x => S.bkPick[x.recordId]).length, b = $('#bkGo');

    $('#bkMsg').textContent = '問題なしの ' + d.ok.length + S.bkU + 'のうち ' + n + S.bkU + 'を選んでいます（要確認の' + S.bkN + 'は、行を開いて1' + S.bkU + 'ずつ承認）';
  };
  upd();
  $('#bkCal').querySelectorAll('[data-pk]').forEach(c => c.addEventListener('change', () => { S.bkPick[c.dataset.pk] = c.checked; upd(); }));
  $('#bkCal').querySelectorAll('[data-row]').forEach(tr => {
    const f = () => { S.bkOpen = S.bkOpen === tr.dataset.row ? '' : tr.dataset.row; bkcRender(d, rows); };
    tr.addEventListener('click', e => { if (e.target.closest('label')) return; f(); });
    tr.addEventListener('keydown', e => { if (e.key === 'Enter') f(); });
  });
  const go1 = $('#bkGo');
  if (go1) go1.onclick = async () => {
    const ids = d.ok.filter(x => S.bkPick[x.recordId]).map(x => x.recordId);
    let r; try { r = await run('approveBulk', ids, S.asEmail); } catch (e) { return; }
    toast(r.done.length + S.bkU + 'を承認しました。PDFを順番に作っています…' + (r.errors.length ? '（承認できなかったもの ' + r.errors.length + S.bkU + '：' + r.errors.map(x => x.label + ' ' + x.error).join('／') + '）' : ''), !!r.errors.length);
    boot(true); openBulk('approve', d.form.no);
    makePdfsInBackground(r.done);
  };
  if (S.bkOpen) bkcDetail(d, rows.find(x => x.recordId === S.bkOpen));
}
function periods_(rows) { return rows.some(x => x.period !== rows[0].period); }
// 行を開いたとき：その機械の月の表（紙と同じ形）と、要確認なら「この機械を承認して押印」
async function bkcDetail(d, x) {
  if (!x) return;
  let sh;
  try { sh = await api('getMonthlySheet', d.form.no, x.no, x.period, S.asEmail); } catch (e) { $('#bkDet').innerHTML = '<p class="ng">読み込めませんでした：' + esc((e && e.message) || e) + '</p>'; return; }
  if (S.bkOpen !== x.recordId || !$('#bkDet')) return;
  S.daily = sh; S.sel = { date: '', marks: {}, nums: {}, note: '', used: [], per: {}, swap: {} };
  const notes = Object.keys(sh.days).sort().filter(k => sh.days[k].note).map(k => (+k.slice(8)) + '日：' + sh.days[k].note);
  $('#bkDet').innerHTML = '<div class="bkc-dh"><b>' + esc(x.label) + '　' + esc(x.period) + '</b><span>担当：' + esc(x.inspector || '―') + '</span>' +
    (x.st === 'bad' ? '<span class="bkc-tag bad">要確認：中身を見て1' + S.bkU + 'ずつ承認</span><button type="button" class="btn primary" id="bkOne">この' + S.bkN + 'を承認して押印</button>' : x.st === 'wait' ? '<span class="bkc-tag wait">' + esc(d.checker) + ' さんの確認が ' + x.unconfirmed + '日分まだ</span>' : '') +
    '<button type="button" class="linkbtn" id="bkOpenRec">記録の画面で開く</button></div>' +
    '<div class="sheet-wrap"><table class="sheet" id="sheet"></table></div>' +
    '<div class="bkc-note"><b>備考</b>　' + (notes.length ? esc(notes.join('　／　')) : 'なし') + '</div>';
  // ほかの画面（記入・記録の中身）に残っている月の表と取り違えないよう、そちらの id を外す（その画面は開くたびに作り直す）
  document.querySelectorAll('#sheet').forEach(t => { if (!t.closest('#bkDet')) t.removeAttribute('id'); });
  renderSheet(true, Object.fromEntries((x.unc || []).map(u => [u, 1])), null);
  $('#bkOpenRec').addEventListener('click', () => openDetail(x.recordId, 'bulk'));
  const one = $('#bkOne');
  if (one) one.addEventListener('click', async () => {
    let r; try { r = await run('approveRecord', x.recordId, S.asEmail); } catch (e) { return; }
    toast(x.label + ' を承認しました。PDFを作っています…');
    S.bkOpen = ''; boot(true); openBulk('approve', d.form.no);
    makePdfInBackground(x.recordId);
  });
}
// まとめて承認したPDFを1件ずつ裏で作る（同時にたくさん呼ばない）
async function makePdfsInBackground(ids) {
  let ok = 0, ng = 0;
  for (const id of ids) {
    try { await api('makePdf', id, S.asEmail); ok++; } catch (e) { ng++; }
  }
  if (ids.length) toast('PDFを ' + ok + '件作りました' + (ng ? '（' + ng + '件は作れませんでした。記録の画面の「PDFを作る」で作り直せます）' : ''), !!ng);
}
function valueView(v) {
  if (/ファイル/.test(v.kind) && v.value) {
    try {
      const o = JSON.parse(v.value);
      return esc(o.choice || '') + (o.files && o.files.length ? '<br>' + o.files.map(f => '<a href="' + esc(f.url) + '" target="_blank" rel="noopener">' + esc(f.name) + '</a>').join('<br>') : '');
    } catch (e) {}
  }
  return esc(v.value);
}

if (!window.QMS) boot();

<script>
/* ================= No.30 不適合改善計画書：1問ずつ答える画面 ================= */
function isKaizenForm(f) { return !!f && String(f.type).indexOf('⑤') === 0; }

// 記入するを押したとき：書きかけがあれば選ぶ、なければ新しく始める
async function openKaizenStart(formNo) {
  let d; try { d = await run('getKaizenStart', formNo, S.asEmail); } catch (e) { return; }
  if (!d.mine.length) { openKaizen(formNo, ''); return; }
  $('#v-entry').innerHTML = '<div class="eyebrow">' + esc(d.form.code) + '</div><h1>' + esc(d.form.name) + '</h1>' +
    '<p class="hint">書きかけ・次の段階の記入待ちの計画書があります。続きを記入するか、新しく作るかを選んでください。</p>' +
    '<div class="kz-pick">' + d.mine.map(x => '<button data-rid="' + esc(x.recordId) + '"><span class="kz-st">' + esc(x.stageName) + (x.state === '差し戻し' ? '<b class="ng">差し戻し</b>' : '') + '</span><b>' + esc(x.title) + '</b><small>更新 ' + esc(fmtAt(x.updatedAt)) + '</small><span class="btn primary">続きを記入</span></button>').join('') +
    '</div><button class="btn" id="kzNew" style="margin-top:16px">＋ 新しい計画書を作る</button>';
  $('#v-entry').querySelectorAll('[data-rid]').forEach(b => b.addEventListener('click', () => openKaizen(formNo, b.dataset.rid)));
  $('#kzNew').addEventListener('click', () => openKaizen(formNo, ''));
  go('entry');
}

function kzDefault(q) {
  switch (q.type) {
    case 'multi': case 'photo': case 'why': return [];
    case 'pair': case 'pairArea': case 'pairPeople': return ['', ''];
    case 'nums': return ['', '', ''];
    case 'plan': return [{ t: '', p: '', d: '' }];
    case 'm4': return { 材料: '', 人: '', 方法: '', 設備: '' };
    case 'sys': { const o = {}; q.items.forEach(k => { o[k] = ['', '', '', '']; }); return o; }
    case 'done': case 'done2': return {};
  }
  return '';
}

async function openKaizen(formNo, recordId) {
  let d; try { d = await run('getKaizen', formNo, recordId, S.asEmail); } catch (e) { return; }
  const qs = d.def[d.stage - 1];
  const ans = d.all[d.stage] || {};
  qs.forEach(q => { if (ans[q.id] === undefined) ans[q.id] = kzDefault(q); });
  const first = qs.findIndex(q => q.req && !kzAnswered(q, ans[q.id]));
  S.kz = { d: d, formNo: formNo, recordId: d.recordId, stage: d.stage, qs: qs, ans: ans, idx: first < 0 ? qs.length : first, inFlight: null, pending: false, savedAt: '', saveMsg: '', saveNg: false };
  kzRender();
  go('entry');
}

function kzAnswered(q, v) {
  if (v === undefined || v === null || v === '') return false;
  switch (q.type) {
    case 'pair': case 'pairArea': case 'nums': case 'pairPeople': return !!(v[0] && v[1]);
    case 'multi': case 'photo': return v.length > 0;
    case 'why': return v.length >= 4;
    case 'plan': return v.some(r => r && String(r.t || '').trim());
    case 'm4': return Object.keys(v).some(k => v[k]);
    case 'sys': return Object.keys(v).every(k => v[k] && v[k][0]);
    case 'done': case 'done2': return Object.keys(v).some(k => v[k]);
  }
  return !!String(v).trim();
}

// 途中保存（画面の操作は止めない）
// 返事が来ないまま待ち続けないよう、時間で区切る
function kzTimeout(p, ms) {
  return Promise.race([p, new Promise((res, rej) => setTimeout(() => rej(new Error('サーバーから返事がありません（' + Math.round(ms / 1000) + '秒）')), ms))]);
}
function kzStatus(msg, ng) {
  const z = S.kz; z.saveMsg = msg; z.saveNg = !!ng;
  const n = $('#kzSaved'); if (n) { n.textContent = msg; n.className = 'kz-save' + (ng ? ' ng' : ''); }
}
function kzPayload(submit) {
  const z = S.kz;
  return { formNo: z.formNo, recordId: z.recordId, stage: z.stage, answers: z.ans, submit: !!submit };
}
// 途中保存：同時に1つだけ送る。送っている間に次の保存が来たら、終わってからもう一度送る
function kzSave() {
  const z = S.kz;
  if (z.inFlight) { z.pending = true; return z.inFlight; }
  kzStatus('保存中…');
  z.inFlight = kzTimeout(api('saveKaizen', kzPayload(false), S.asEmail), 20000)
    .then(r => { z.recordId = r.recordId; z.savedAt = r.savedAt; kzStatus('途中保存しました（' + fmtAt(r.savedAt) + '）'); })
    .catch(e => { kzStatus('保存できませんでした（次へを押すと送り直します）：' + ((e && e.message) || e), true); })
    .finally(() => { z.inFlight = null; if (z.pending) { z.pending = false; kzSave(); } });
  return z.inFlight;
}
// 提出：すぐ「処理中」を出し、失敗したら理由を出す
async function kzSubmit() {
  const z = S.kz;
  $('#busy').hidden = false;
  try {
    if (z.inFlight && !z.recordId) await z.inFlight; // 書き始めの記録がまだ作られていないときだけ待つ（最長20秒）
    const r = await kzTimeout(api('saveKaizen', kzPayload(true), S.asEmail), 60000);
    z.recordId = r.recordId;
    return r;
  } catch (e) {
    toast('提出できませんでした：' + ((e && e.message) || e), true);
    throw e;
  } finally {
    $('#busy').hidden = true;
  }
}

function kzToc() {
  const z = S.kz, qs = z.qs;
  const secs = [...new Set(qs.map(q => q.sec))];
  const curSec = z.idx < qs.length ? qs[z.idx].sec : null;
  return '<div class="kz-count mono">' + (z.idx < qs.length ? (z.idx + 1) + ' / ' + qs.length + ' 問目' : '見直し') + '</div>' +
    '<div class="kz-meter"><span style="width:' + Math.round(Math.min(z.idx, qs.length) / qs.length * 100) + '%"></span></div><ol>' +
    secs.map(s => {
      const items = qs.map((q, i) => ({ q, i })).filter(x => x.q.sec === s);
      const done = items.every(x => !x.q.req || kzAnswered(x.q, z.ans[x.q.id]));
      return '<li class="' + (s === curSec ? 'cur ' : '') + (done ? 'done' : '') + '"><button data-go="' + items[0].i + '">' + esc(s) + '</button></li>';
    }).join('') + '<li class="' + (z.idx === qs.length ? 'cur' : '') + '"><button data-go="' + qs.length + '">見直して提出</button></li></ol>' +
    '<p class="kz-save' + (z.saveNg ? ' ng' : '') + '" id="kzSaved">' + esc(z.saveMsg || (z.savedAt ? '途中保存しました（' + fmtAt(z.savedAt) + '）' : '「次へ」を押すたびに途中保存します。あとから続きを記入できます。')) + '</p>';
}

function kzPhotoUrl(id) { return 'https://drive.google.com/thumbnail?id=' + encodeURIComponent(id) + '&sz=w400'; }

function kzBody(q) {
  const z = S.kz, v = z.ans[q.id], people = z.d.people;

  switch (q.type) {
    case 'choice': return '<div class="kz-choices">' + q.opts.map(o => { const val = Array.isArray(o) ? o[0] : o, sub = Array.isArray(o) ? o[1] : ''; return '<button class="kz-choice" data-val="' + esc(val) + '" aria-pressed="' + (v === val) + '">' + esc(val) + (sub ? '<small>' + esc(sub) + '</small>' : '') + '</button>'; }).join('') + '</div>';

    case 'textarea': return '<textarea class="kz-inp" id="kzIn">' + esc(v) + '</textarea>';
    case 'pair': return '<div class="kz-stack"><label>' + esc(q.a[0]) + '<input class="kz-inp" id="kzA" value="' + esc(v[0]) + '" placeholder="' + esc(q.a[1]) + '"></label><label>' + esc(q.b[0]) + '<input class="kz-inp" id="kzB" value="' + esc(v[1]) + '" placeholder="' + esc(q.b[1]) + '"></label></div>';
    case 'pairPeople': return '<div class="kz-stack">' + [q.a, q.b].map((l, i) => '<label>' + esc(l) + '<select class="kz-inp" id="kzP' + i + '"><option value="">選んでください</option>' + people.map(p => '<option' + (p === v[i] ? ' selected' : '') + '>' + esc(p) + '</option>').join('') + '</select></label>').join('') + '</div>';
    case 'pairArea': return '<div class="kz-stack"><label>' + esc(q.a) + '<textarea class="kz-inp" id="kzA" style="min-height:96px">' + esc(v[0]) + '</textarea></label><label>' + esc(q.b) + '<textarea class="kz-inp" id="kzB" style="min-height:96px">' + esc(v[1]) + '</textarea></label></div>';
    case 'nums': return '<div class="kz-stack">' + q.fields.map((f, i) => '<label>' + esc(f[0]) + '<span class="kz-row"><input class="kz-inp mono" id="kzN' + i + '" inputmode="numeric" value="' + esc(v[i]) + '" style="max-width:180px"><span class="kz-unit">' + esc(f[1]) + '</span></span></label>').join('') +
      '<label>' + esc(q.extra[0]) + '<input class="kz-inp mono" id="kzN2" value="' + esc(v[2]) + '" placeholder="' + esc(q.extra[1]) + '" style="max-width:300px"></label></div>';
    case 'photo': return '<div class="kz-drop"><label class="btn" for="kzPh">写真を選ぶ（カメラ・画像）</label><input id="kzPh" type="file" accept="image/*" multiple hidden><small>1枚10MBまで。選ぶとすぐ保存されます。</small></div>' +
      '<div class="kz-thumbs">' + (v.length ? v.map((p, i) => '<div class="kz-thumb"><img src="' + kzPhotoUrl(p.id) + '" alt="' + esc(p.name) + '"><button class="kz-del" data-delph="' + i + '" aria-label="この写真を外す">✕</button></div>').join('') : '<p class="kz-unit">まだありません</p>') + '</div>';
    case 'm4': return '<div class="kz-m4">' + [['材料', 'Material'], ['人', 'Man（作業者）'], ['方法', 'Method'], ['設備', 'Machine（製造設備）']].map(([k, e]) =>
      '<label class="kz-m4-row" for="kzM_' + k + '"><span><b>' + k + '</b> <small class="kz-unit">' + e + '</small></span><input id="kzM_' + k + '" data-k="' + k + '" value="' + esc(v[k] || '') + '" placeholder="変わったことが無ければ空欄"></label>').join('') + '</div>';
    case 'why': {
      const n = v.length;
      return '<ol class="kz-ladder">' + v.map((t, i) => '<li class="' + (i === 0 ? 'phen' : '') + '"><span class="w mono">' + (i === 0 ? '現象' : i + 'W') + '</span><span>' + esc(t) + (i === n - 1 ? '　<button class="linkbtn" id="kzUndo">直す</button>' : '') + '</span></li>').join('') + '</ol>' +
        (n >= 6 ? '<p class="hint"><b>5W まで出しました。</b>最後の「なぜ」が真の原因です。</p>' :
        '<div class="kz-why-now"><span class="mono">' + (n === 0 ? '現象' : n + 'W') + '</span>　' + (n === 0 ? esc(q.kind) + 'した現象は？' : 'それは「なぜ」ですか？') + '</div>' +
        '<textarea class="kz-inp" id="kzWhy" style="min-height:90px" placeholder="' + (n === 0 ? '例：外径が上限を超えた' : '前の答えの理由を書きます') + '"></textarea>' +
        '<div class="kz-why-btns"><button class="btn primary" id="kzWhyNext">' + (n === 0 ? '現象を決めて「なぜ？」へ' : '次の「なぜ？」へ') + '</button>' + (n >= 3 ? '<button class="btn" id="kzWhyStop">ここが真の原因（終わる）</button>' : '') + '</div>' +
        '<p class="hint" style="margin-top:10px">「なぜ」を5回くり返します。3W まで答えたら、原因に届いたところで終われます。</p>');
    }
    case 'plan': return kzPlanHtml(v, people);
    case 'sys': return '<div class="kz-sys">' + q.items.map((k, i) => { const r = v[k] || ['', '', '', '']; const on = r[0] === '要'; return '<div class="kz-sys-row' + (on ? ' on' : '') + '"><b>' + esc(k) + '</b><div class="kz-yn" role="group" aria-label="' + esc(k) + 'の要否"><button class="y" data-i="' + i + '" data-v="要" aria-pressed="' + on + '">要</button><button class="n" data-i="' + i + '" data-v="否" aria-pressed="' + (r[0] === '否') + '">否</button></div>' +
      (on ? '<div class="kz-sys-more"><input id="kzSys' + i + '" data-i="' + i + '" data-j="1" value="' + esc(r[1]) + '" placeholder="内容（文書番号）"><select id="kzSysP' + i + '" data-i="' + i + '" data-j="2" aria-label="担当"><option value="">担当</option>' + people.map(p => '<option' + (p === r[2] ? ' selected' : '') + '>' + esc(p) + '</option>').join('') + '</select><input type="date" id="kzSysD' + i + '" data-i="' + i + '" data-j="3" value="' + esc(r[3] || '') + '" aria-label="期限"></div>' : '<span></span>') + '</div>'; }).join('') + '</div>';
    case 'done': {
      const rows = [...(st1.k_h || []), ...(st1.k_r || []), ...(st1.k_y || [])].filter(r => r && r.t);
      return '<div class="kz-sys">' + (rows.length ? rows.map((r, i) => '<div class="kz-sys-row"><span>' + esc(r.t) + '<br><small class="kz-unit">担当 ' + esc(r.p || '―') + '　期限 ' + esc(fmtDates(r.d || '―')) + '</small></span><span></span><label>完了日 <input type="date" id="kzD' + i + '" data-i="' + i + '" value="' + esc(v[i] || '') + '"></label></div>').join('') : '<p>「① 計画」の恒久対策がありません。</p>') + '</div>';
    }
    case 'done2': {
      const rows = Object.keys(st1.sys || {}).filter(k => st1.sys[k][0] === '要');
      return '<div class="kz-sys">' + (rows.length ? rows.map((k, i) => '<div class="kz-sys-row"><b>' + esc(k) + '</b><span>' + esc(st1.sys[k][1]) + '</span><label>完了日 <input type="date" id="kzS' + i + '" data-k="' + esc(k) + '" value="' + esc(v[k] || '') + '"></label></div>').join('') : '<p>「要」の項目はありません。</p>') + '</div>';
    }
  }
  return '';
}

function kzWire(q) {
  const z = S.kz, root = $('#v-entry');
  const touch = () => { const t = $('#kzToc'); if (t) { t.innerHTML = kzToc(); kzWireToc(); } };
  root.querySelectorAll('.kz-choice').forEach(b => b.addEventListener('click', () => {
    if (q.type === 'multi') { const s = new Set(z.ans[q.id]); s.has(b.dataset.val) ? s.delete(b.dataset.val) : s.add(b.dataset.val); z.ans[q.id] = [...s]; kzRender(); }
    else { z.ans[q.id] = b.dataset.val; kzRender(); setTimeout(kzNext, 220); }
  }));
  const one = $('#kzIn'); if (one) one.addEventListener('input', e => { z.ans[q.id] = e.target.value; touch(); });
  [['kzA', 0], ['kzB', 1], ['kzN0', 0], ['kzN1', 1], ['kzN2', 2], ['kzP0', 0], ['kzP1', 1]].forEach(([id, i]) => { const el = $('#' + id); if (el) el.addEventListener('input', e => { z.ans[q.id][i] = e.target.value; touch(); }); });
  root.querySelectorAll('.kz-m4-row input').forEach(el => el.addEventListener('input', e => { z.ans[q.id][e.target.dataset.k] = e.target.value; touch(); }));
  const ph = $('#kzPh'); if (ph) ph.addEventListener('change', async () => {
    for (const f of [...ph.files]) {
      if (f.size > 10 * 1024 * 1024) { toast(f.name + ' は大きすぎます（10MBまで）', true); continue; }
      try { const r = await run('uploadKaizenPhoto', { name: f.name, mimeType: f.type, data: await readFileB64(f) }, S.asEmail); z.ans[q.id].push(r); } catch (e) { /* 表示済み */ }
    }
    kzRender(); kzSave(false);
  });
  root.querySelectorAll('[data-delph]').forEach(b => b.addEventListener('click', () => { z.ans[q.id].splice(+b.dataset.delph, 1); kzRender(); kzSave(false); }));
  if (q.type === 'why') {
    const arr = z.ans[q.id];
    const nx = $('#kzWhyNext'); if (nx) nx.addEventListener('click', () => { const t = $('#kzWhy').value.trim(); if (!t) { toast('答えを書いてから進みます', true); return; } arr.push(t); kzRender(); });
    const sp = $('#kzWhyStop'); if (sp) sp.addEventListener('click', () => {
      const t = $('#kzWhy').value.trim();
      if (t) arr.push(t);
      if (arr.length < 4) { toast('3W まで答えてから終われます', true); kzRender(); return; }
      kzRender(); setTimeout(kzNext, 200);
    });
    const un = $('#kzUndo'); if (un) un.addEventListener('click', () => { const last = arr.pop(); kzRender(); const w = $('#kzWhy'); if (w) { w.value = last; w.focus(); } });
    const wi = $('#kzWhy'); if (wi) wi.focus();
  }
  if (q.type === 'plan') {
    root.querySelectorAll('.kz-plan [data-k]').forEach(el => el.addEventListener('input', e => { z.ans[q.id][+e.target.dataset.i][e.target.dataset.k] = e.target.value; touch(); }));
    root.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => { z.ans[q.id].splice(+b.dataset.del, 1); if (!z.ans[q.id].length) z.ans[q.id].push({ t: '', p: '', d: '' }); kzRender(); }));
    $('#kzAddRow').addEventListener('click', () => { z.ans[q.id].push({ t: '', p: '', d: '' }); kzRender(); });
  }
  if (q.type === 'sys') {
    const row = i => { const k = q.items[i]; if (!z.ans[q.id][k]) z.ans[q.id][k] = ['', '', '', '']; while (z.ans[q.id][k].length < 4) z.ans[q.id][k].push(''); return z.ans[q.id][k]; };
    root.querySelectorAll('.kz-yn button').forEach(b => b.addEventListener('click', () => { row(+b.dataset.i)[0] = b.dataset.v; kzRender(); }));
    root.querySelectorAll('.kz-sys-more [data-j]').forEach(el => el.addEventListener(el.tagName === 'SELECT' ? 'change' : 'input', e => { row(+e.target.dataset.i)[+e.target.dataset.j] = e.target.value; }));
  }
  if (q.type === 'done') root.querySelectorAll('[id^=kzD]').forEach(el => el.addEventListener('input', e => { z.ans[q.id][e.target.dataset.i] = e.target.value; touch(); }));
  if (q.type === 'done2') root.querySelectorAll('[id^=kzS]').forEach(el => el.addEventListener('input', e => { z.ans[q.id][e.target.dataset.k] = e.target.value; touch(); }));
}

function kzWireToc() {
  $('#kzToc').querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => { kzSave(false); S.kz.idx = +b.dataset.go; kzRender(); }));
}

// 見直し・PDF・中身の画面で使う、答えの文字表示
function kzValText(q, v, all) {
  if (!kzAnswered(q, v)) return null;
  switch (q.type) {
    case 'pair': return q.a[0] + '：' + v[0] + '\n' + q.b[0] + '：' + v[1];
    case 'pairArea': return '発生：' + v[0] + '\n流出：' + v[1];
    case 'pairPeople': return q.a + '：' + v[0] + '\n' + q.b + '：' + v[1];
    case 'nums': return '不具合 ' + v[0] + '個 ／ 納入 ' + v[1] + '個' + (v[2] ? ' ／ 注番 ' + v[2] : '');
    case 'multi': return v.join('、');
    case 'photo': return v.length + '枚';
    case 'why': return v.map((t, i) => (i === 0 ? '現象' : i + 'W') + '：' + t).join('\n');
    case 'plan': return v.filter(r => r && r.t).map((r, i) => (i + 1) + '. ' + r.t + '（' + (r.p || '担当未定') + '・' + fmtDates(r.d || '期限未定') + '）').join('\n');
    case 'm4': return Object.keys(v).filter(k => v[k]).map(k => k + '：' + v[k]).join('\n');
    case 'sys': return Object.keys(v).map(k => k + '：' + v[k][0] + (v[k][0] === '要' ? '（' + [v[k][1], v[k][2] ? '担当 ' + v[k][2] : '', v[k][3] ? '期限 ' + fmtDates(v[k][3]) : ''].filter(Boolean).join('・') + '）' : '')).join('\n');
    case 'done': {
      const st1 = (all && all[1]) || {};
      const rows = [...(st1.k_h || []), ...(st1.k_r || []), ...(st1.k_y || [])].filter(r => r && r.t);
      return rows.map((r, i) => r.t + '：' + (v[i] ? '完了 ' + fmtDates(v[i]) : 'まだ')).join('\n');
    }
    case 'done2': return Object.keys(v).filter(k => v[k]).map(k => k + '：完了 ' + fmtDates(v[k])).join('\n');
    case 'date': return fmtDates(v);
  }
  return String(v);
}

function kzReview() {
  const z = S.kz, qs = z.qs, secs = [...new Set(qs.map(q => q.sec))];
  const missing = qs.filter(q => q.req && !kzAnswered(q, z.ans[q.id]));
  const stageName = z.d.stageNames[z.stage - 1];
  return '<div class="kz-sec">見直し</div><h2 class="kz-q">答えを見直して、提出します</h2><p class="hint">直したいところは「直す」を押すと、その問いに戻ります。</p><div class="kz-review">' +
    secs.map(s => '<h3>' + esc(s) + '</h3><dl>' + qs.map((q, i) => ({ q, i })).filter(x => x.q.sec === s).map(({ q, i }) => {
      const t = kzValText(q, z.ans[q.id], z.d.all);
      return '<dt>' + esc(q.q.replace(/[？?].*$/, '').replace(/^なぜなぜ分析：/, '')) + '</dt><dd>' + (t == null ? '<span class="ng">' + (q.req ? '未回答（必須）' : '未回答') + '</span>' : esc(t)) + '</dd><dd><button class="linkbtn" data-go="' + i + '">直す</button></dd>';
    }).join('') + '</dl>').join('') + '</div>' +
    '<div class="info" style="margin-top:20px"><b>「' + esc(stageName) + '」を提出すると</b>：' + esc(z.d.route.checker || '―') + ' さんが確認 → ' + esc(z.d.route.approver || '―') + ' さんが承認します。</div>' +
    '<div class="kz-nav"><button class="btn" id="kzBack">戻る</button>' + (missing.length ? '<span class="ng">必須の問いが ' + missing.length + ' つ残っています</span>' : '<span></span>') +
    '<button class="btn primary big" id="kzSubmit"' + (missing.length ? ' disabled' : '') + '>「' + esc(stageName) + '」を提出する</button></div>';
}

function kzRender() {
  const z = S.kz, qs = z.qs;
  const head = '<div class="eyebrow">' + esc(z.d.form.code) + '</div><h1>' + esc(z.d.form.name) + '</h1>' +
    '<div class="kz-stages">' + z.d.stageNames.map((n, i) => '<span class="' + (i + 1 === z.stage ? 'on' : i + 1 < z.stage ? 'past' : '') + '">' + esc(n) + (i + 1 < z.stage ? '　承認済み' : i + 1 === z.stage ? '　記入中' : '') + '</span>').join('') + '</div>' +
    (z.d.returnComment ? '<div class="alert" style="margin:0 0 16px"><b>差し戻されました：</b>' + esc(z.d.returnComment) + '</div>' : '');
  let card;
  if (z.idx >= qs.length) card = kzReview();
  else {
    const q = qs[z.idx];
    card = '<div class="kz-sec">' + esc(q.sec) + '</div><h2 class="kz-q">' + esc(q.q) + (q.req ? '<span class="kz-req">必須</span>' : '') + '</h2>' +
      '<p class="hint">' + esc(q.help || '') + '</p>' + kzBody(q) +
      '<div class="kz-nav"><button class="btn" id="kzBack"' + (z.idx === 0 ? ' disabled' : '') + '>戻る</button><span>' + (!q.req ? '<button class="linkbtn" id="kzSkip">この問いは飛ばす</button>' : '') + '</span>' +
      '<button class="btn primary big" id="kzNext">' + (z.idx === qs.length - 1 ? '見直しへ' : '次へ') + '</button></div>';
  }
  $('#v-entry').innerHTML = head + '<div class="kz-wrap"><aside class="kz-toc" id="kzToc">' + kzToc() + '</aside><section class="kz-card">' + card + '</section></div>';
  kzWireToc();
  const bk = $('#kzBack'); if (bk) bk.addEventListener('click', () => { if (z.idx > 0) { z.idx--; kzRender(); } });
  if (z.idx >= qs.length) {
    $('#v-entry').querySelectorAll('.kz-review [data-go]').forEach(b => b.addEventListener('click', () => { z.idx = +b.dataset.go; kzRender(); }));
    const sb = $('#kzSubmit');
    if (sb) sb.addEventListener('click', async () => {
      let r; try { r = await kzSubmit(); } catch (e) { return; }
      toast('「' + z.d.stageNames[z.stage - 1] + '」を提出しました');
      await boot(true);
      openDetail(r.recordId, 'home');
    });
    return;
  }
  kzWire(qs[z.idx]);
  $('#kzNext').addEventListener('click', kzNext);
  const sk = $('#kzSkip'); if (sk) sk.addEventListener('click', () => { z.idx++; kzSave(false); kzRender(); });
}

function kzNext() {
  const z = S.kz, q = z.qs[z.idx];
  if (q && q.req && !kzAnswered(q, z.ans[q.id])) { toast(q.type === 'why' ? 'なぜなぜは 3W 以上まで答えます' : 'この問いは必須です', true); return; }
  z.idx++; kzSave(false); kzRender(); window.scrollTo(0, 0);
}

/* ---- 記録の中身の画面（段階ごとの答えと押印） ---- */
function kaizenStampsHtml(rec) {
  const k = rec.kaizen;
  const cell = s => s ? dateStamp(s.info, s.date, 54) : '<div class="hanko"></div>';
  return '<div class="kz-stampsets">' + k.stageNames.map((n, i) => {
    const s = k.stages.find(x => x.no === i + 1);
    return '<div class="kz-set"><div class="kz-set-t">' + esc(n) + (s ? '<small>' + esc(s.state) + '</small>' : '<small>まだ</small>') + '</div><div class="kz-set-row">' +
      ['approver', 'checker', 'maker'].map((r, j) => '<div class="stamp">' + cell(s && s[r]) + '<span>' + ['承認', '確認', '作成'][j] + '</span></div>').join('') + '</div></div>';
  }).join('') + '</div>';
}
function kaizenViewHtml(rec) {
  const k = rec.kaizen, all = {};
  k.stages.forEach(s => { all[s.no] = s.answers; });
  return k.stages.map(s => {
    const qs = k.def[s.no - 1];
    const secs = [...new Set(qs.map(q => q.sec))];
    const empty = !qs.some(q => kzAnswered(q, s.answers[q.id]));
    return '<section class="kz-view"><h2>' + esc(s.name) + '<small>' + esc(s.state) + '</small></h2>' + (empty ? '<p class="hint">まだ記入されていません。</p>' :
      secs.map(sec => '<h3>' + esc(sec) + '</h3><dl class="kv">' + qs.filter(q => q.sec === sec).map(q => {
        const v = s.answers[q.id];
        let html;
        if (q.type === 'photo' && v && v.length) html = '<div class="kz-thumbs">' + v.map(p => '<a href="https://drive.google.com/file/d/' + encodeURIComponent(p.id) + '/view" target="_blank" rel="noopener" class="kz-thumb"><img src="' + kzPhotoUrl(p.id) + '" alt="' + esc(p.name) + '"></a>').join('') + '</div>';
        else { const t = kzValText(q, v, all); html = t == null ? '<span class="kz-unit">―</span>' : esc(t).replace(/\n/g, '<br>'); }
        return '<dt>' + esc(q.q.replace(/[？?].*$/, '').replace(/^なぜなぜ分析：/, '')) + '</dt><dd>' + html + '</dd>';
      }).join('') + '</dl>').join('')) + '</section>';
  }).join('');
}
</script>

<script>
/* ================= 設備異常記録台帳（QC-01-030付表1、帳票No.32、v0.21.0） =================
 * 点検で ×（要修理）が出たら、手順（QC-01-030）を見て台帳に記入する。
 * 見本 https://claude.ai/artifact/KLLexmejdje83KeeQiWgsa でユーザー合意。
 */
const IJ = { date: 1, person: 2, machine: 3, what: 4, fixDate: 5, fix: 6, prevent: 7, before: 8, beforeFix: 9, after: 10, afterFix: 11, re: 12, reDate: 13, src: 14 };
function isIjouForm(f) { return !!f && String(f.type).indexOf('⑥') === 0; }
function ijFormNo() { const f = (S.boot.forms || []).find(isIjouForm); return f ? f.no : 32; }

// 手順の要点（画面の中央に出す）
function showProc(proc, onLedger) {
  const bg = document.createElement('div');
  bg.className = 'ask-bg';
  bg.innerHTML = '<div class="ask ij-proc" role="dialog" aria-modal="true" aria-labelledby="ijProcT"><h3 id="ijProcT"></h3><div class="ij-code mono"></div><ol></ol>' +
    '<div class="ask-btns"><button type="button" class="btn" data-a="0">閉じる</button>' + (onLedger ? '<button type="button" class="btn primary" data-a="1">台帳に記入する</button>' : '') + '</div></div>';
  bg.querySelector('h3').textContent = proc.name;
  bg.querySelector('.ij-code').textContent = proc.code;
  bg.querySelector('ol').innerHTML = proc.steps.map(s => '<li>' + esc(s) + '</li>').join('');
  const done = v => { document.removeEventListener('keydown', key); bg.remove(); if (v && onLedger) onLedger(); };
  const key = e => { if (e.key === 'Escape') done(false); };
  bg.addEventListener('click', e => { if (e.target === bg) done(false); const b = e.target.closest('[data-a]'); if (b) done(b.dataset.a === '1'); });
  document.addEventListener('keydown', key);
  document.body.appendChild(bg);
  bg.querySelector('[data-a="' + (onLedger ? 1 : 0) + '"]').focus();
}
const IJ_PROC = { code: 'QC-01-030', name: '設備異常アクション手順', steps: [
  '設備異常（停電・火災・故障）に対処する。',
  '対処後、設備異常の前に作ったワーク5個と、設備復旧後に作ったワーク5個を、全数全箇所検査する。',
  '異常前の品に不具合があったときは、全数ロットアウトとする。',
  '復旧後の品に不具合があったときは、機械メーカーに再度連絡する。',
  'その記録を設備異常記録台帳に記録する。'] };

// 点検の記入画面の × の案内（ボタンつき）
function xAlertHtml(id, hidden) {
  return '<div class="alert ij-x" id="' + id + '"' + (hidden ? ' hidden' : '') + '><b>×（要修理）があります。</b>設備異常アクション手順（QC-01-030）に従ってください。提出すると、そのまま設備異常記録台帳の記入に進めます。' +
    '<div class="ij-x-b"><button type="button" class="btn sm" data-proc="1">手順を見る</button></div></div>';
}
function wireProc(root) { (root || document).querySelectorAll('[data-proc]').forEach(b => b.onclick = () => showProc(IJ_PROC)); }

// 点検を提出したあと、× があれば台帳の記入をすすめる
async function offerIjou(list) {
  if (!list || !list.length) return;
  const names = list.map(x => x.machine).join('、');
  if (!(await ask('×（要修理）を付けた機械があります（' + names + '）。\n設備異常記録台帳に記入しますか？\n（あとで書くときは、帳票一覧の「設備異常記録台帳」から開けます）', '台帳に記入する'))) return;
  openIjou(ijFormNo(), { prefill: list[0] });
}

/* ---- 入口：台帳（年度ごと）・記入・記録 ---- */
async function openIjou(formNo, opt) {
  opt = opt || {};
  if (!opt.recordId && !opt.prefill && !opt.blank) return openIjouYear(opt.fy);
  let d;
  try { d = await run('getIjou', opt.recordId || '', opt.prefill || null, S.asEmail); } catch (e) { return; }
  if (opt.recordId && !d.canEdit) { openDetail(opt.recordId, 'forms'); return; }
  S.ijou = d;
  renderIjou();
  go('entry');
}

function ijVal(no) { const el = $('#ij' + no); if (!el) return S.ijou.values[no] || ''; return el.value; }
function ijJudge(no) { const b = document.querySelector('[data-ijg="' + no + '"][aria-pressed="true"]'); return b ? b.dataset.v : ''; }
function ijCollect() {
  const v = Object.assign({}, S.ijou.values);
  [IJ.date, IJ.person, IJ.machine, IJ.what, IJ.fixDate, IJ.fix, IJ.prevent, IJ.beforeFix, IJ.afterFix].forEach(no => { v[no] = ijVal(no).trim(); });
  v[IJ.before] = ijJudge(IJ.before); v[IJ.after] = ijJudge(IJ.after);
  if (v[IJ.before] !== '否') v[IJ.beforeFix] = '';
  if (v[IJ.after] !== '否') v[IJ.afterFix] = '';
  return v;
}
function ijMissing(v) {
  const out = [];
  [[IJ.date, '発生日', 0], [IJ.person, '担当者', 0], [IJ.machine, '機種／機番', 0], [IJ.what, '異常内容', 0], [IJ.fixDate, '対処日', 1], [IJ.fix, '対処内容', 1], [IJ.prevent, '再発防止策', 1],
   [IJ.before, '異常前の品の検査', 2], [IJ.after, '復旧後の品の検査', 3]].forEach(([no, name, sec]) => { if (!v[no]) out.push([no, name, sec]); });
  if (v[IJ.before] === '否' && !v[IJ.beforeFix]) out.push([IJ.beforeFix, '異常前の品：否のときの対処内容', 2]);
  if (v[IJ.after] === '否' && !v[IJ.afterFix]) out.push([IJ.afterFix, '復旧後の品：否のときの対処内容', 3]);
  return out;
}

function renderIjou() {
  const d = S.ijou, f = d.form, v = d.values;
  const fld = (no, label, ctrl, sub) => '<div class="gen-f" data-item="' + no + '"><label class="gen-lb" for="ij' + no + '">' + esc(label) + (sub ? '<span class="gen-sub">' + esc(sub) + '</span>' : '') + '</label><div class="gen-c">' + ctrl + '</div></div>';
  const auto = d.recordId ? '' : '<span class="ij-auto">自動</span>';
  const date = no => '<div class="gen-row"><input type="date" id="ij' + no + '" value="' + esc(v[no] || '') + '" max="' + esc(S.boot.today) + '"><button type="button" class="btn sm" data-today="ij' + no + '">今日</button></div>';
  const txt = (no, ph) => '<textarea id="ij' + no + '" rows="3" placeholder="' + esc(ph || '') + '">' + esc(v[no] || '') + '</textarea>';
  const judge = no => '<div class="ij-gk" role="group"><button type="button" class="go" data-ijg="' + no + '" data-v="合" aria-pressed="' + (v[no] === '合') + '">合<small>不具合なし</small></button><button type="button" class="no" data-ijg="' + no + '" data-v="否" aria-pressed="' + (v[no] === '否') + '">否<small>不具合あり</small></button></div>';
  const sec = (i, title, body) => '<section class="gen-sec" id="ijs' + i + '"><div class="gen-sec-h"><span class="n">' + '①②③④'.charAt(i) + '</span><b>' + esc(title) + '</b><small id="ijsc' + i + '"></small></div><div class="gen-sec-b">' + body + '</div></section>';
  $('#v-entry').innerHTML =
    '<div class="doc-head"><div><div class="eyebrow">' + esc(f.cat) + ' ・ 異常があったとき</div><h1>' + esc(f.name) + '</h1>' +
    '<div class="doc-meta"><span>管理番号 <span class="mono">' + esc(f.code) + '</span></span><span>設備異常アクション手順（QC-01-030）</span><span>' + esc(f.keep ? f.keep + '保管' : '') + '</span><span>' + (fyOfDate(v[IJ.date]) + '年度') + '　<b>No.' + d.n + '</b></span></div></div>' +
    '<div class="pickers"><button type="button" class="btn" id="ijYear">年度の台帳を見る</button></div></div>' +
    (d.returnComment ? '<div class="alert" style="margin:0 0 16px"><b>差し戻されました：</b>' + esc(d.returnComment) + '</div>' : '') +
    '<div class="gen-grid"><form id="ijForm" novalidate>' +
    sec(0, '発生', fld(IJ.date, '発生日', date(IJ.date)) +
      fld(IJ.person, '担当者', '<select id="ij' + IJ.person + '">' + d.people.map(p => '<option' + (p === v[IJ.person] ? ' selected' : '') + '>' + esc(p) + '</option>').join('') + '</select>') +
      fld(IJ.machine, '機種／機番', '<input type="text" id="ij' + IJ.machine + '" list="ijMc" value="' + esc(v[IJ.machine] || '') + '" placeholder="例：B12Ⅵ N 80号機"><datalist id="ijMc">' + d.machines.map(x => '<option value="' + esc(x) + '">').join('') + '</datalist>') +
      fld(IJ.what, '異常内容', txt(IJ.what, '例：主軸から異音。回転数を上げると大きくなる'), v[IJ.src] ? '点検の備考から入りました。直せます' : '')) +
    sec(1, '対処', fld(IJ.fixDate, '対処日', date(IJ.fixDate)) + fld(IJ.fix, '対処内容', txt(IJ.fix, '例：メーカーに修理を依頼。主軸ベアリングを交換')) + fld(IJ.prevent, '再発防止策', txt(IJ.prevent, '例：主軸の異音を始業前点検に入れる'))) +
    sec(2, '異常前の品の検査（5個・全数全箇所）', '<div class="gen-f" data-item="' + IJ.before + '"><span class="gen-lb">判定</span><div class="gen-c">' + judge(IJ.before) + '<div class="ij-rule" id="ijr' + IJ.before + '"></div></div></div>' +
      '<div id="ijw' + IJ.beforeFix + '">' + fld(IJ.beforeFix, '否のときの対処内容', txt(IJ.beforeFix, '例：全数ロットアウト（120個）')) + '</div>') +
    sec(3, '復旧後の品の検査（5個・全数全箇所）', '<div class="gen-f" data-item="' + IJ.after + '"><span class="gen-lb">判定</span><div class="gen-c">' + judge(IJ.after) + '<div class="ij-rule" id="ijr' + IJ.after + '"></div></div></div>' +
      '<div id="ijw' + IJ.afterFix + '">' + fld(IJ.afterFix, '否のときの対処内容', txt(IJ.afterFix, '例：メーカーに再度連絡。11/25に再調整の予定')) + '</div>') +
    '</form><aside class="gen-side" aria-label="提出の前に">' +
    '<div class="gen-box"><h2>提出の前に</h2><ul class="gen-chk" id="ijChk"></ul></div>' +
    '<div class="gen-box gen-submit"><span class="gen-msg" id="ijMsg"></span><button type="button" class="btn primary big" id="ijSubmit">' + (d.state === '差し戻し' ? '直して再提出する' : '提出する') + '</button>' +
    '<button type="button" class="btn" id="ijSave">途中保存</button><small id="ijSaved">' + (d.recordId ? '修理が終わるまでは、途中保存で置いておけます。ホームの「記入」に残ります' : '途中保存すると、ホームの「記入」に残ります') + '</small></div>' +
    '<div class="gen-box"><h2>提出したあとの流れ</h2><ol class="gen-flow"><li><b>確認</b><small>' + esc(d.route.checker || '―') + ' さん（管理監督者）</small></li><li><b>承認</b><small>' + esc(d.route.approver || '―') + ' さん</small></li><li><b>年度の台帳PDFに入る</b><small>承認されるたびに作り直します</small></li><li><b>年度末の承認</b><small>5月の終わりに社長が台帳全体を承認</small></li></ol></div>' +
    '<div class="gen-box"><h2>手順の要点（QC-01-030）</h2><p class="ij-tip">異常前5個・復旧後5個を全数全箇所検査。異常前に不具合→全数ロットアウト。復旧後に不具合→メーカーに再度連絡。</p><div style="padding:0 14px 14px"><button type="button" class="btn" style="width:100%" id="ijProc">手順を見る</button></div></div>' +
    '</aside></div>';
  if (auto) [IJ.date, IJ.person, IJ.machine].forEach(no => { const l = document.querySelector('[data-item="' + no + '"] .gen-lb'); if (l && (no !== IJ.machine || v[no])) l.insertAdjacentHTML('beforeend', auto); });
  const form = $('#ijForm');
  form.querySelectorAll('[data-today]').forEach(b => b.onclick = () => { $('#' + b.dataset.today).value = S.boot.today; ijUpdate(); });
  form.querySelectorAll('[data-ijg]').forEach(b => b.onclick = () => {
    form.querySelectorAll('[data-ijg="' + b.dataset.ijg + '"]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    ijUpdate();
  });
  form.addEventListener('input', ijUpdate);
  form.addEventListener('change', ijUpdate);
  form.addEventListener('submit', e => e.preventDefault());
  $('#ijSubmit').onclick = () => saveIjouUi(true);
  $('#ijSave').onclick = () => saveIjouUi(false);
  $('#ijProc').onclick = () => showProc(IJ_PROC);
  $('#ijYear').onclick = () => openIjouYear(fyOfDate(ijVal(IJ.date) || S.boot.today));
  ijUpdate();
}
function fyOfDate(s) { const y = +String(s).slice(0, 4), m = +String(s).slice(5, 7); return m >= 6 ? y : y - 1; }
function ijUpdate() {
  const v = ijCollect(), miss = ijMissing(v);
  [IJ.before, IJ.after].forEach(no => {
    const r = $('#ijr' + no), w = $('#ijw' + (no + 1));
    if (w) w.hidden = v[no] !== '否';
    if (r) { r.className = 'ij-rule' + (v[no] === '否' ? ' ng' : ''); r.textContent = v[no] === '否' ? (no === IJ.before ? '「否」なので全数ロットアウトです。対処内容を書いてください。' : '「否」なので機械メーカーに再度連絡し、対処内容を書いてください。') : no === IJ.before ? '「否」のときは全数ロットアウト。対処内容を書きます。' : '「否」のときは機械メーカーに再度連絡。対処内容を書きます。'; }
  });
  // 書き始めた区切りだけ、まだの欄に「未入力」（v0.21.2）
  const secOf = { [IJ.date]: 0, [IJ.person]: 0, [IJ.machine]: 0, [IJ.what]: 0, [IJ.fixDate]: 1, [IJ.fix]: 1, [IJ.prevent]: 1, [IJ.before]: 2, [IJ.beforeFix]: 2, [IJ.after]: 3, [IJ.afterFix]: 3 };
  const started = i => Object.keys(secOf).some(no => secOf[no] === i && v[no]);
  Object.keys(secOf).forEach(no => { const el = document.querySelector('#ijForm .gen-f[data-item="' + no + '"]'); if (!el) return; const miss = started(secOf[no]) && miss0(+no); el.classList.toggle('miss', miss); if (miss) el.dataset.miss = '未入力'; else delete el.dataset.miss; });
  function miss0(no) { return miss.some(x => x[0] === no); }
  for (let i = 0; i < 4; i++) { const c = $('#ijsc' + i), n = miss.filter(x => x[2] === i).length; if (c) { c.textContent = n ? '残り ' + n + '項目' : '✔ 入力済み'; c.className = n ? '' : 'done'; } }
  const all = [[IJ.date, '発生（日・担当者・機番・内容）', 0], [IJ.fixDate, '対処（日・内容・再発防止策）', 1], [IJ.before, '異常前の品の検査', 2], [IJ.after, '復旧後の品の検査', 3]];
  $('#ijChk').innerHTML = all.map(([no, name, i]) => { const ok = !miss.some(x => x[2] === i); return '<li class="' + (ok ? 'ok' : 'no') + '"><i>' + (ok ? '✔' : '！') + '</i><a href="#ijs' + i + '" data-go="' + i + '">' + esc(name) + '</a></li>'; }).join('');
  $('#ijChk').querySelectorAll('[data-go]').forEach(a => a.onclick = e => { e.preventDefault(); $('#ijs' + a.dataset.go).scrollIntoView({ behavior: 'smooth', block: 'start' }); });
  $('#ijMsg').textContent = miss.length ? 'まだの項目が ' + miss.length + 'つあります' : '';
  $('#ijSubmit').disabled = miss.length > 0;
}
async function saveIjouUi(submit) {
  const d = S.ijou, v = ijCollect();
  if (!v[IJ.date]) { toast('発生日を入れてください', true); return; }
  if (submit) {
    const miss = ijMissing(v); if (miss.length) { toast('まだの項目があります：' + miss.map(x => x[1]).join('、'), true); return; }
    if (!(await ask('設備異常記録台帳を提出します。\n' + (d.route.checker || '管理監督者') + ' さんの確認、' + (d.route.approver || '社長') + ' さんの承認に進みます。', '提出する'))) return;
  }
  let r;
  try { r = await run('saveIjou', { recordId: d.recordId, values: v, submit: submit }, S.asEmail); } catch (e) { return; }
  d.recordId = r.recordId; d.values = v; d.state = r.state;
  if (submit) { toast('提出しました'); boot(true); openDetail(r.recordId, 'home'); return; }
  toast('途中まで保存しました');
  const sv = $('#ijSaved'); if (sv) sv.textContent = '✔ 途中まで保存しました（' + fmtAt(r.savedAt) + '）';
  boot(true);
}

/* ---- 年度の台帳 ---- */
async function openIjouYear(fy) {
  let d;
  try { d = await run('getIjouYear', fy || '', S.asEmail); } catch (e) { return; }
  S.ijYear = d;
  const st = s => '<span class="st ' + (s === '承認済み' ? 'done' : s === '差し戻し' ? 'back' : 'wait') + '">' + esc(s) + '</span>';
  const jd = (j, re) => j ? '<b class="ij-j ' + (j === '否' ? 'no' : 'go') + '">' + esc(j) + '</b>' + (j === '否' && re ? '<small class="ij-re">→ 合 ' + esc(re) + '</small>' : '') : '';
  const ap = (label, s, can, kind, note) => '<div class="ij-ap"><span>' + label + '</span>' + (s ? dateStamp(s.info, s.date, 64) : can ? '<button class="hanko me" data-yap="' + kind + '">承認<br>押印</button>' : '<div class="hanko"></div>') + '<small>' + esc(note || '') + '</small></div>';
  $('#v-entry').innerHTML =
    '<div class="doc-head"><div><div class="eyebrow">設備点検 ・ 年度の台帳</div><h1>' + esc(d.form.name) + '</h1>' +
    '<div class="doc-meta"><span>管理番号 <span class="mono">' + esc(d.form.code) + '</span></span><span>' + esc(d.fyLabel) + '</span><span>' + d.rows.length + '件</span></div></div>' +
    '<div class="pickers"><label class="picker" for="ijFy">年度<select id="ijFy">' + d.years.map(y => '<option value="' + y + '"' + (y === d.fy ? ' selected' : '') + '>' + y + '年度</option>').join('') + '</select></label>' +
    '<button type="button" class="btn" id="ijProc2">手順を見る</button><button type="button" class="btn primary" id="ijNew">新しく記入する</button></div></div>' +
    '<div class="panel"><div class="sheet-wrap"><table class="rec ij-tbl"><thead><tr><th>No.</th><th>発生日</th><th>機種／機番</th><th>異常内容</th><th>異常前</th><th>復旧後</th><th>担当者</th><th>状態</th></tr></thead><tbody>' +
    (d.rows.length ? d.rows.map(x => '<tr data-rid="' + esc(x.recordId) + '" data-st="' + esc(x.state) + '" tabindex="0"><td class="mono">' + x.n + '</td><td>' + esc(x.date) + '</td><td>' + esc(x.machine) + '</td><td>' + esc(x.what) + '</td><td>' + jd(x.before, x.after !== '否' ? x.reDate : '') + '</td><td>' + jd(x.after, x.reDate) + (x.needsRe ? '<small class="ij-re ng">修理完了・合の判定まだ</small>' : '') + '</td><td>' + esc(x.person) + '</td><td>' + st(x.state) + '</td></tr>').join('')
      : '<tr><td colspan="8" class="ij-empty">この年度の記録はまだありません。点検で ×（要修理）を付けたときや、「新しく記入する」から記入します。</td></tr>') +
    '</tbody></table></div></div>' +
    '<section class="ij-aps"><h2>年度の承認（社長）</h2><div class="ij-ap-row">' +
    ap('年度末承認', d.yearEnd, d.canYearEnd, '年度末', d.yearEnd ? fmtAt(d.yearEnd.at) : '5月の最後の出勤日から') +
    ap('最終承認', d.final, d.canFinal, '最終', d.final ? fmtAt(d.final.at) : d.finalNeeded ? '修理完了・合の判定がそろったら' : d.yearEnd ? '該当なし' : '「否」・修理未完了があるときだけ') +
    '</div>' + (d.why ? '<p class="waiting">' + esc(d.why) + '</p>' : '') +
    (d.pdfUrl ? '<a class="btn primary" href="' + esc(d.pdfUrl) + '" target="_blank" rel="noopener">台帳のPDFを開く ↗</a>' : '<p class="hint">台帳のPDFは、記録が1件承認されるとできます。</p>') + '</section>';
  $('#ijFy').onchange = e => openIjouYear(+e.target.value);
  $('#ijProc2').onclick = () => showProc(IJ_PROC);
  $('#ijNew').onclick = () => openIjou(d.form.no, { blank: true });
  $('#v-entry').querySelectorAll('[data-rid]').forEach(tr => {
    const open = () => (tr.dataset.st === '記入中' || tr.dataset.st === '差し戻し') ? openIjou(d.form.no, { recordId: tr.dataset.rid }) : openDetail(tr.dataset.rid, 'forms');
    tr.onclick = open; tr.onkeydown = e => { if (e.key === 'Enter') open(); };
  });
  $('#v-entry').querySelectorAll('[data-yap]').forEach(b => b.onclick = async () => {
    const kind = b.dataset.yap;
    if (!(await ask(d.fy + '年度の設備異常記録台帳（' + d.rows.length + '件）を' + (kind === '年度末' ? '年度末承認' : '最終承認') + 'します。', '承認して押印'))) return;
    let r;
    try { r = await run('approveIjouYear', d.fy, kind, S.asEmail); } catch (e) { return; }
    toast(kind === '年度末' ? (r.finalNeeded ? '年度末承認しました。修理完了・合の判定がそろったら、最終承認をしてください' : '年度末承認しました') : '最終承認しました');
    boot(true); openIjouYear(d.fy);
  });
  go('entry');
}

// 記録の画面：修理完了・合の判定を入れる（承認済みの「否」の記録）
function ijDetailHtml(rec) {
  if (!rec.ijou) return '';
  let h = '<div style="margin:12px 0"><button type="button" class="btn" id="ijToYear">' + rec.ijou.fy + '年度の台帳を見る</button></div>';
  if (rec.ijou.canRe) h += '<section class="act-panel"><h2>修理完了・合の判定を入れる</h2><p class="hint">「否」の判定がありました。修理が終わり、検査で「合」になったら日付を入れて押してください。年度末の最終承認の条件になります。</p>' +
    '<div class="gen-row"><input type="date" id="ijReDate" value="' + esc(S.boot.today) + '" max="' + esc(S.boot.today) + '"><button type="button" class="btn primary" id="ijRe">合になった</button></div></section>';
  return h;
}
function wireIjDetail(rec) {
  if (!rec.ijou) return;
  const y = $('#ijToYear'); if (y) y.onclick = () => openIjouYear(rec.ijou.fy);
  const b = $('#ijRe'); if (!b) return;
  b.onclick = async () => {
    const dt = $('#ijReDate').value;
    if (!dt) { toast('日付を入れてください', true); return; }
    if (!(await ask(jpDate(dt) + ' に、修理完了・検査で「合」になったと記録します。', '記録する'))) return;
    try { await run('rejudgeIjou', rec.recordId, dt, S.asEmail); } catch (e) { return; }
    toast('記録しました'); makePdfInBackground(rec.recordId); boot(true); openDetail(rec.recordId, S.back);
  };
}
</script>

<script>
/* ================= 12ヶ月設備点検（No.17〜19）と予定表（No.20）、v0.22.0 =================

function pmMissing(d) {
  const out = [], mk = d.data.marks, nums = d.data.nums, notes = d.data.notes;
  d.def.forEach((s, si) => {
    let bad = false;
    s.items.forEach(it => it.parts.forEach((pt, pi) => {
      const k = it.no + '.' + pi, m = mk[k], nm = it.no + (pt ? '（' + pt + '）' : '');
      if (!m) { out.push({ si: si, k: k, t: nm }); return; }
      if (m === '△' || m === '×') bad = true;
      if (it.num && m !== '━') {
        if (nums[k] === '' || nums[k] == null || isNaN(parseFloat(nums[k]))) out.push({ si: si, k: k, t: nm + 'の数値', num: 1 });
        else if (m === 'レ' && pmNumOut(it.num, nums[k])) out.push({ si: si, k: k, t: nm + '（範囲外なのにレ）', num: 1 });
      }
    }));
    if (bad && !String(notes[si] || '').trim()) out.push({ si: si, k: 'note' + si, t: s.name + 'の備考' });
  });
  return out;
}

function pmItemOf(k) { const no = +k.split('.')[0]; for (const s of S.pm.def) for (const it of s.items) if (it.no === no) return it; return {}; }
// 表示の更新（入力中の数値欄は作り直さない）
