  const sur = s => String(s || '').split(/[\s　]/)[0];
  const cell = (r, mo) => {
    const ym = (mo >= 6 ? d.fy : d.fy + 1) + '-' + String(mo).padStart(2, '0');
    if (ed) return '<td class="p ed" data-mv="' + esc(r.no) + '" data-mo="' + mo + '">' + (r.month === mo ? '<span class="s-plan">予定</span>' : '') + '</td>';
    if (r.month !== mo) return '<td class="p"></td>';
    let k = r.st;
    if ((k === 'none' || k === 'draft') && ym < curYm) k = 'late';
    const s = k === 'late' ? ['遅れ', 's-late'] : PM_ST[k] || ['予定', 's-plan'];
    return '<td class="p"><span class="' + s[1] + '">' + s[0] + '</span></td>';
  };
  const res = r => {
    if (r.paper) return '<td class="res mono">' + esc(r.paperDate ? r.paperDate.slice(5).replace('-', '/') : '―') + '</td><td class="res"><span class="sl">紙の記録</span></td>';
    const j = r.judge ? '<span class="pm-jc">' + (r.judgeStamp ? dateStamp(r.judgeStamp.info, r.judgeStamp.date, 38) : '') + '<b class="' + (r.judge === '否' ? 'ng' : 'go') + '">' + pmJ(r.judge) + '</b></span>' : '';
    const re = r.judge === '否' ? (r.re ? '<span class="pm-jc">' + (r.reStamp ? dateStamp(r.reStamp.info, r.reStamp.date, 38) : '') + '<b class="go">合格</b><small>修理後</small></span>' : '<span class="pm-jc"><span class="ng">修理待ち</span></span>') : '';
    return '<td class="res mono">' + esc(r.date ? r.date.slice(5).replace('-', '/') : '') + '</td><td class="res pm-jcell">' + j + re + '</td>';
  };
  const people = d.people;
  const body = rows.map((r, i) => '<tr data-row="' + i + '"' + (ed ? '' : ' class="go"') + '><td class="mc"><b>' + esc(r.spec || '') + ' ' + esc(r.no) + '</b><small>No.' + r.formNo + '</small></td>' +
    '<td>' + (ed ? '<select class="who" data-who="' + i + '" aria-label="' + esc(r.no) + '号機の担当者">' + (people.indexOf(r.person) < 0 ? '<option>' + esc(r.person) + '</option>' : '') + people.map(p => '<option' + (p === r.person ? ' selected' : '') + '>' + esc(p) + '</option>').join('') + '</select>' : esc(sur(r.person))) + '</td>' +
    PM_MONTHS.map(mo => cell(r, mo)).join('') +
    (ed ? '<td colspan="2" class="res"><label class="pm-paper"><input type="checkbox" data-paper="' + i + '"' + (r.paper ? ' checked' : '') + '>紙で実施済み</label><input type="date" class="pm-pd" data-pd="' + i + '" value="' + esc(r.paperDate || '') + '"' + (r.paper ? '' : ' hidden') + ' aria-label="紙の実施日"></td><td><input class="pm-nt" data-nt="' + i + '" value="' + esc(r.note || '') + '" placeholder="備考" aria-label="備考"><button type="button" class="linkbtn" data-del="' + i + '">外す</button></td>'
      : res(r) + '<td class="res nt">' + esc(r.note || '') + '</td>') + '</tr>').join('');
  const ap = d.monthAp.map(a => '<td>' + (a.stamp ? dateStamp(a.stamp.info, a.stamp.date, 40) : a.can ? '<button type="button" class="hanko me sm" data-map="' + a.ym + '" aria-label="' + (+a.ym.slice(5)) + '月を承認">承認</button>' : '') + '</td>').join('');
  const yap = (label, s, can, kind, note) => '<div class="ij-ap"><span>' + label + '</span>' + (s ? dateStamp(s.info, s.date, 60) : can ? '<button class="hanko me" data-yap="' + kind + '">承認<br>押印</button>' : '<div class="hanko"></div>') + '<small>' + esc(note || '') + '</small></div>';
  $('#v-entry').innerHTML =
    '<div class="doc-head"><div><div class="eyebrow">設備点検 ・ 年度ごと</div><h1>' + esc(d.form.name) + '</h1>' +
    '<div class="doc-meta"><span>管理番号 <span class="mono">' + esc(d.form.code) + '</span></span><span>' + d.fy + '年度（' + d.fy + '年6月〜' + (d.fy + 1) + '年5月）</span><span>' + rows.length + '台</span></div></div>' +
    '<div class="pickers"><label class="picker" for="pmFy">年度<select id="pmFy">' + d.years.map(y => '<option value="' + y + '"' + (y === d.fy ? ' selected' : '') + '>' + y + '年度</option>').join('') + '</select></label>' +
    (d.canEdit && !ed ? '<button type="button" class="btn" id="pmEdit">予定を直す</button>' + (!d.hasNext ? '<button type="button" class="btn" id="pmCopy">次年度を作る（今年度を写す）</button>' : '') : '') +
    (ed ? '' : (d.pdfUrl ? '<a class="btn primary" href="' + esc(d.pdfUrl) + '" target="_blank" rel="noopener">PDFを開く ↗</a><button type="button" class="linkbtn" id="pmPdf">PDFを作り直す</button>' : '<button type="button" class="btn primary" id="pmPdf">PDFを作る</button>')) + '</div></div>' +
    (ed ? '<div class="pm-edit-bar"><b>予定を直しています。</b>月のマスを押すと予定月が移ります。担当者は名前を選び直します。直した内容は変更の記録（設備台帳の変更の記録）に残ります。' +
      '<span class="pm-add"><select id="pmAddNo" aria-label="追加する機械"><option value="">機械を追加…</option>' + d.machines.filter(x => !ed.some(r => r.no === x.no)).map(x => '<option value="' + esc(x.no) + '">' + esc(x.label) + '</option>').join('') + '</select></span>' +
      '<button type="button" class="btn" id="pmCancel">やめる</button><button type="button" class="btn primary" id="pmSaveP">保存する</button></div>'
      : '<div class="legend pm-legend"><span><i class="s-plan"></i>予定</span><span><i class="s-wait"></i>判定・承認待ち</span><span><i class="s-done"></i>合格</span><span><i class="s-ng"></i>不合格（修理待ち）</span><span><i class="s-late"></i>遅れ</span><span><i class="s-paper"></i>紙で実施</span><span>行を押すと点検記録</span></div>') +
    '<div class="tblw"><table class="pm-pl"><thead><tr><th>機種・機番</th><th>担当者</th>' + PM_MONTHS.map(mo => { const ym = (mo >= 6 ? d.fy : d.fy + 1) + '-' + String(mo).padStart(2, '0'); return '<th class="' + (ym === curYm ? 'now' : '') + '">' + mo + '月</th>'; }).join('') + '<th>実施日</th><th>確認・合否</th><th>備考</th></tr></thead><tbody>' + body + '</tbody>' +
    (ed ? '' : '<tfoot><tr><td colspan="2" class="ap-l">社長 月の承認</td>' + ap + '<td colspan="3"></td></tr></tfoot>') + '</table></div>' +
    (ed ? '' : '<section class="ij-aps"><h2>年度の承認（社長）</h2><div class="ij-ap-row">' + yap('年度末承認', d.yearEnd, d.canYearEnd, '年度末', d.yearEnd ? fmtAt(d.yearEnd.at) : '5月の最後の出勤日から') +
      yap('最終承認', d.final, d.canFinal, '最終', d.final ? fmtAt(d.final.at) : d.finalNeeded ? '否の機械の再判定のあと' : d.yearEnd ? '該当なし' : '「否」の機械があるときだけ') + '</div>' + (d.why ? '<p class="waiting">' + esc(d.why) + '</p>' : '') + '</section>');
  const v = $('#v-entry');
  $('#pmFy').onchange = e => openPmPlan(+e.target.value);
  const on = (id, fn) => { const b = $('#' + id); if (b) b.onclick = fn; };
  on('pmEdit', () => { S.pmEdit = d.rows.map(r => ({ no: r.no, spec: r.spec, month: r.month, person: r.person, formNo: r.formNo, paper: r.paper, paperDate: r.paperDate, note: r.note })); renderPmPlan(); });
  on('pmCancel', () => { S.pmEdit = null; renderPmPlan(); });
  on('pmSaveP', async () => {
    if (!(await ask(d.fy + '年度の予定を保存します（' + ed.length + '台）。', '保存する'))) return;
    let r; try { r = await run('savePmPlan', d.fy, ed, S.asEmail); } catch (e) { return; }
    toast('保存しました（変更 ' + r.changes + '件）'); boot(true); openPmPlan(d.fy);
  });
  on('pmCopy', async () => {
    if (!(await ask(d.fy + '年度の予定を写して、' + (d.fy + 1) + '年度の予定を作ります。変える機械だけ、あとで直してください。', '次年度を作る'))) return;
    try { await run('copyPmPlan', d.fy, S.asEmail); } catch (e) { return; }
    toast((d.fy + 1) + '年度の予定を作りました'); openPmPlan(d.fy + 1);
  });
  on('pmPdf', async () => { toast('PDFを作っています…'); let r; try { r = await run('makePmPlanPdfNow', d.fy, S.asEmail); } catch (e) { return; } toast('PDFを作りました'); openPmPlan(d.fy); });
  if (ed) {
    v.querySelectorAll('[data-mv]').forEach(td => td.onclick = () => { const r = ed.find(x => x.no === td.dataset.mv); r.month = +td.dataset.mo; renderPmPlan(); });
    v.querySelectorAll('[data-who]').forEach(s => s.onchange = () => { ed[+s.dataset.who].person = s.value; });
    v.querySelectorAll('[data-paper]').forEach(c => c.onchange = () => { ed[+c.dataset.paper].paper = c.checked; renderPmPlan(); });
    v.querySelectorAll('[data-pd]').forEach(i => i.onchange = () => { ed[+i.dataset.pd].paperDate = i.value; });
    v.querySelectorAll('[data-nt]').forEach(i => i.oninput = () => { ed[+i.dataset.nt].note = i.value; });
    v.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { ed.splice(+b.dataset.del, 1); renderPmPlan(); });
    const add = $('#pmAddNo'); if (add) add.onchange = () => { const x = d.machines.find(mm => mm.no === add.value); if (!x) return; ed.push({ no: x.no, spec: x.label.replace(/\s*\d+号機$/, ''), month: 6, person: '', formNo: 0, paper: false, paperDate: '', note: '' }); renderPmPlan(); };
    return;
  }
  v.querySelectorAll('tr.go').forEach(tr => tr.onclick = () => { const r = rows[+tr.dataset.row]; if (r.paper) { toast('紙で実施済みの機械です（アプリの記録はありません）'); return; } if (r.recordId && ['draft', 'returned'].indexOf(r.st) < 0) openDetail(r.recordId, 'forms'); else openPm(r.no, d.fy, r.recordId); });
  v.querySelectorAll('[data-map]').forEach(b => b.onclick = async e => {
    e.stopPropagation();
    const ym = b.dataset.map;
    if (!(await ask(d.fy + '年度の予定表の ' + (+ym.slice(5)) + '月分を承認します。', '承認して押印'))) return;
    try { await run('approvePmPlan', d.fy, '月:' + ym, S.asEmail); } catch (e2) { return; }
    toast((+ym.slice(5)) + '月分を承認しました'); boot(true); openPmPlan(d.fy);
  });
  v.querySelectorAll('[data-yap]').forEach(b => b.onclick = async () => {
    const kind = b.dataset.yap;
    if (!(await ask(d.fy + '年度の予定表を' + (kind === '年度末' ? '年度末承認' : '最終承認') + 'します。', '承認して押印'))) return;
    let r; try { r = await run('approvePmPlan', d.fy, kind, S.asEmail); } catch (e) { return; }
    toast(kind === '年度末' && r.finalNeeded ? '年度末承認しました。否の機械の再判定がそろったら、最終承認をしてください' : '承認しました'); boot(true); openPmPlan(d.fy);
  });
}
</script>

<script>
/* ================= わたしの担当（v0.24.0） =================
 * 見本 https://claude.ai/artifact/11zreuHtYw8Wif6z9PBJoE でユーザー合意。
 */
async function openMine() {
  let d;
  try { d = await run('getMine', S.asEmail); } catch (e) { return; }
  S.mine = d;
  renderMine();
  go('entry');
}
function renderMine() {
  const d = S.mine, v = $('#v-entry');
  const band = (title, sub, body) => '<div class="mn-band"><h2>' + title + '<small>' + sub + '</small></h2><div class="mn-list">' + body + '</div></div>';
  const chip = (cls, t) => '<span class="mn-chip ' + cls + '">' + esc(t) + '</span>';
  const md = s => s ? (+s.slice(5, 7)) + '月' + (+s.slice(8, 10)) + '日' : '';
  const any = d.daily.length || d.monthly.length || d.yearly.length || d.drafts.length || d.roles.length;
  let h = '<div class="eyebrow">わたしの担当</div><h1>' + esc(d.me) + ' さんの担当</h1><p class="hint">' + (+d.ym.slice(0, 4)) + '年' + (+d.ym.slice(5)) + '月 ・ 担当している点検と、確認・承認の役目。押すと記入画面や記録が開きます</p>';
  if (!any) {
    v.innerHTML = h + '<div class="mn-empty">点検や確認の担当はありません。記入するときは「帳票一覧」から帳票を選んでください。<br><button type="button" class="btn" id="mnForms" style="margin-top:12px">帳票一覧へ</button></div>';
    $('#mnForms').onclick = openForms; return;
  }
  // 毎日
  if (d.daily.length) h += band('毎日', '出勤日ごとの点検', d.daily.map(g =>
    '<div class="mn-card"><div class="mn-h"><b>' + esc(g.formName) + '</b><span class="mono mn-code">' + esc(g.code) + '</span><span class="mn-sp"></span>' +
    (g.items.length >= 2 ? '<button type="button" class="btn primary" data-multi="' + g.formNo + '">担当の' + g.items.length + g.unit + 'をまとめて記入</button>' : '') + '</div>' +
    g.items.map(x => {
      const st = x.today === 'todo' ? chip('todo', '今日まだ') : x.missing > 0 ? chip('todo', '出ていない日 ' + x.missing) : x.today === 'off' ? chip('ok', '今日は休み') : x.today === 'rest' ? chip('ok', '今日は休み（休）') : chip('ok', '今日は済み');
      const cells = x.cal.split('').map((c, i) => { const ds = d.ym + '-' + String(i + 1).padStart(2, '0'); const can = c !== ' '; return '<i class="' + (c === ' ' ? 'f' : c) + (ds === d.today ? ' now' : '') + '"' + (can ? ' data-day="' + ds + '" data-f="' + g.formNo + '" data-no="' + esc(x.no) + '" role="button" tabindex="0"' : '') + ' title="' + (i + 1) + '日"></i>'; }).join('');
      return '<div class="mn-mc"><span class="mn-nm">' + esc(x.label) + '<small>提出 ' + x.done + '日' + (x.state === '差し戻し' ? '・差し戻し' : x.state === '承認済み' ? '・承認済み' : '') + '</small></span>' +
        '<div class="mn-cal" style="grid-template-columns:repeat(' + x.cal.length + ',minmax(0,1fr))">' + cells + '</div>' + st +
        '<button type="button" class="btn sm" data-open="' + esc(x.no) + '" data-f="' + g.formNo + '">開く</button></div>';
    }).join('') +
    '<div class="mn-lg"><span><i class="k"></i>提出</span><span><i class="t"></i>△・備考</span><span><i class="x"></i>×</span><span><i class="m"></i>出ていない日</span><span><i class="o"></i>休み</span><span>マスを押すとその日を開く</span></div></div>').join(''));
  // 月に1回
  if (d.monthly.length) h += band('月に1回', '月次点検など', '<div class="mn-card">' + d.monthly.map(x =>
    '<div class="mn-row"><span><b>' + esc(x.formName) + '　' + esc(x.label) + '　月次点検</b><small>' + (x.done ? md(x.date) + ' ' + esc(x.by) + ' さんが記入' : md(x.from) + '（その月の最後の出勤日）から記入') + '</small></span>' +
    (x.done ? chip('ok', '済み') : x.open ? chip('todo', 'まだ') : chip('plan', md(x.from) + 'から')) +
    '<button type="button" class="btn sm' + (!x.done && x.open ? ' primary' : '') + '" data-mon="' + esc(x.no) + '" data-f="' + x.formNo + '">' + (x.done ? '見る・直す' : '記入する') + '</button></div>').join('') + '</div>');
  // 年に1回
  if (d.yearly.length) {
    const PST = { none: ['予定', 'plan'], draft: ['書きかけ', 'wait'], returned: ['差し戻し', 'todo'], wait: ['判定待ち', 'wait'], approve: ['承認待ち', 'wait'], done: ['合格', 'ok'], ng: ['不合格（修理待ち）', 'todo'], paper: ['紙で実施済み', 'paper'] };
    h += band('年に1回', '12ヶ月設備点検（' + d.fy + '年度）', '<div class="mn-card">' + d.yearly.map(x => {
      let s = PST[x.st] || ['予定', 'plan'];
      if ((x.st === 'none' || x.st === 'draft') && x.ym < d.ym) s = ['遅れ', 'todo'];
      const act = x.st === 'paper' ? '' : ['none', 'draft', 'returned'].indexOf(x.st) >= 0 ? '<button type="button" class="btn sm primary" data-pm="' + esc(x.no) + '" data-rid="' + esc(x.recordId) + '">' + (x.st === 'none' ? '記入する' : x.st === 'draft' ? '続きを記入' : '直す') + '</button>' : '<button type="button" class="btn sm" data-rec="' + esc(x.recordId) + '">記録を見る</button>';
      return '<div class="mn-row"><span><b>' + esc(x.label) + '</b><small>' + x.month + '月予定 ・ No.' + x.formNo + '</small></span>' + chip(s[1], s[0]) + act + '</div>';
    }).join('') + '<div class="mn-foot"><button type="button" class="btn sm" id="mnPlan">' + d.fy + '年度の予定表</button></div></div>');
  }
  // 書きかけ・差し戻し
  if (d.drafts.length) h += band('書きかけ', '途中保存・差し戻し', '<div class="mn-card">' + d.drafts.map((x, i) =>
    '<div class="mn-row"><span><b>' + esc(x.formName) + '　' + esc(x.target || '') + '</b><small>' + (x.state === '差し戻し' ? '差し戻し：' + esc(x.comment) : esc(fmtAt(x.updatedAt)) + ' 途中保存') + '</small></span>' +
    chip(x.state === '差し戻し' ? 'todo' : 'wait', x.state === '差し戻し' ? '差し戻し' : '書きかけ') + '<button type="button" class="btn sm primary" data-draft="' + i + '">' + (x.state === '差し戻し' ? '直す' : '続きを記入') + '</button></div>').join('') + '</div>');
  // 確認・承認の役目
  if (d.roles.length) h += band('確認・承認', '管理監督者・社長の役目', '<div class="mn-card">' + d.roles.map((x, i) => {
    const n = x.nConfirm + x.nApprove;
    const sub = (x.nConfirm ? (x.daily ? '確認待ち ' + x.nConfirm + '日分' : '確認待ち ' + x.nConfirm + '件') : '') + (x.nConfirm && x.nApprove ? '・' : '') + (x.nApprove ? '承認待ち ' + x.nApprove + '件' : '') || '待っているものはありません';
    return '<div class="mn-row"><span><b>' + esc(x.formName) + '</b><small>' + esc(x.role) + ' ・ ' + esc(sub) + '</small></span>' + chip(n ? 'wait' : 'ok', n ? n + '件' : 'なし') +
      '<button type="button" class="btn sm' + (n ? ' primary' : '') + '" data-role="' + i + '">' + (x.daily && x.nConfirm ? 'まとめて確認へ' : x.daily && x.nApprove ? 'まとめて承認へ' : x.pm || x.pmPlan ? '予定表' : x.ijou ? '台帳' : '確認・承認の一覧') + '</button></div>';
  }).join('') + '</div>');
  v.innerHTML = h;
  // 押したとき
  v.querySelectorAll('[data-multi]').forEach(b => b.onclick = () => openMulti(+b.dataset.multi));
  v.querySelectorAll('[data-open]').forEach(b => b.onclick = () => openDaily(+b.dataset.f, b.dataset.open, d.ym));
  v.querySelectorAll('.mn-cal [data-day]').forEach(c => { const f = () => openDaily(+c.dataset.f, c.dataset.no, d.ym, c.dataset.day); c.onclick = f; c.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); f(); } }; });
  v.querySelectorAll('[data-mon]').forEach(b => b.onclick = () => openDaily(+b.dataset.f, b.dataset.mon, d.ym, 'monthly'));
  v.querySelectorAll('[data-pm]').forEach(b => b.onclick = () => openPm(b.dataset.pm, d.fy, b.dataset.rid));
  v.querySelectorAll('[data-rec]').forEach(b => b.onclick = () => openDetail(b.dataset.rec, 'entry'));
  const pl = $('#mnPlan'); if (pl) pl.onclick = () => openPmPlan(d.fy);
  v.querySelectorAll('[data-draft]').forEach(b => b.onclick = () => {
    const x = d.drafts[+b.dataset.draft];
    if (x.kind === 'kaizen') openKaizen(x.formNo, x.recordId);
    else if (x.kind === 'ijou') openIjou(x.formNo, { recordId: x.recordId });
    else if (x.kind === 'pm') openPm('', '', x.recordId);
    else if (x.kind === 'daily') openDaily(x.formNo, x.target0, x.period);
    else openGeneric(x.formNo, x.recordId);
  });
  v.querySelectorAll('[data-role]').forEach(b => b.onclick = () => {
    const x = d.roles[+b.dataset.role];
    if (x.daily && x.nConfirm) openBulk('confirm', x.formNo);
    else if (x.daily && x.nApprove) openBulk('approve', x.formNo);
    else if (x.pm || x.pmPlan) openPmPlan(d.fy);
    else if (x.ijou) openIjouYear();
    else openApprovals();
  });
}
</script>

</body>
